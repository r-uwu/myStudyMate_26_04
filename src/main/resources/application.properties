# ===============================
# 1. Profile & Application Info
# ===============================
# API Key ? ?? ??? ???? secret ????? ?????.
spring.profiles.include=secret
spring.application.name=MSM

# ===============================
# 2. Database Configuration (H2 File Mode)
# ===============================
# mem?? file ??? ???? ??? ???? ?????.
spring.datasource.url=jdbc:h2:file:./local_db/study_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# 3. JPA Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# ?? ????? ??? update? ???? ?? ???? ?????.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Web Console ??
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Redis ?? ?? ? ???? ??? ?? ??
management.health.redis.enabled=false
spring.data.redis.repositories.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB


openai.prompts.feynman-analyzer=Role: Backend peer (Java Spring Boot). \
Goal: Acknowledge logic or point out one fatal blind spot. \
Constraint: Max 1-2 Korean sentences. No praise, no summary, no emojis. \
Logic: 1. If correct, reply \"????.\" or similar and STOP. 2. If a technical flaw exists, ask ONE sharp question about edge cases. \
Format: Text only.
# ===============================
# 1. Profile & Application Info
# ===============================
# API Key 등 보안 설정이 들어있는 secret 프로파일을 포함합니다.
spring.profiles.include=secret
spring.application.name=MSM

# ===============================
# 2. Database Configuration (H2 File Mode)
# ===============================
# mem에서 file 모드로 변경하여 데이터 영속성을 확보합니다.
#spring.datasource.url=jdbc:h2:file:./local_db/study_db;AUTO_SERVER=TRUE
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

# MySQL 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/msm_db?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# 3. JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect



# H2 Web Console 설정
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ===============================
# 4. Web & Multipart Configuration
# ===============================
# STT 음성 파일 업로드를 위해 파일 용량 제한을 확장합니다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# MyBatis mapper XML file location
mybatis.mapper-locations=classpath:mapper/**/*.xml

# Enable automatic camel case mapping (e.g., session_id -> sessionId)
mybatis.configuration.map-underscore-to-camel-case=true

# Disable Redis Health Indicator to prevent Malformed uxxxx encoding error on Windows
management.health.redis.enabled=false



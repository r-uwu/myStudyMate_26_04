# ===============================
# 1. Profile & Application Info
# ===============================
# API Key ? ?? ??? ???? secret ????? ?????.
spring.profiles.include=secret
spring.application.name=MSM

# ===============================
# 2. Database Configuration (H2 File Mode)
# ===============================
# mem?? file ??? ???? ??? ???? ?????.
spring.datasource.url=jdbc:h2:file:./local_db/study_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# 3. JPA Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# ?? ????? ??? update? ???? ?? ???? ?????.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Web Console ??
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Redis ?? ?? ? ???? ??? ?? ??
management.health.redis.enabled=false
spring.data.redis.repositories.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB


openai.prompts.feynman-analyzer=Role: Backend student peer learning from the user (Java Spring Boot).\n\
Tone: Casual peer. Extreme brevity (1-2 sentences max). No praise, no evaluations, no emojis. NEVER echo, paraphrase, or summarize user input.\n\
Task: 1. The user is teaching you a concept or logic. 2. If the explanation is logically sound, acknowledge briefly that you understood and STOP. Do not generate examples. 3. ONLY ask ONE sharp question if a fatal technical blind spot or edge case is missing.\n\
Rules: Korean only. Strictly separate chat from JSON.
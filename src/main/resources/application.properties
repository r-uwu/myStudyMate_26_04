# ===============================
# 1. Profile & Application Info
# ===============================
# API Key 등 보안 설정이 들어있는 secret 프로파일을 포함합니다.
spring.profiles.include=secret
spring.application.name=MSM

# ===============================
# 2. Database Configuration (H2 File Mode)
# ===============================
# mem에서 file 모드로 변경하여 데이터 영속성을 확보합니다.
#spring.datasource.url=jdbc:h2:file:./local_db/study_db;AUTO_SERVER=TRUE
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

# MySQL 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/msm_db?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# 3. JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect



# H2 Web Console 설정
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ===============================
# 4. Web & Multipart Configuration
# ===============================
# STT 음성 파일 업로드를 위해 파일 용량 제한을 확장합니다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# MyBatis mapper XML file location
mybatis.mapper-locations=classpath:mapper/**/*.xml

# Enable automatic camel case mapping (e.g., session_id -> sessionId)
mybatis.configuration.map-underscore-to-camel-case=true

# Disable Redis Health Indicator to prevent Malformed uxxxx encoding error on Windows
management.health.redis.enabled=false


#openai.prompts.feynman-analyzer=Role: Backend student peer learning from user (Java Spring Boot).\n\
#Tone: Casual peer. Max 2 sentences. No emojis, praise, echoes, or evaluations.\n\
#Task: 1. Evaluate silently. 2. If user logic is correct and sound, acknowledge briefly and STOP. DO NOT invent questions, edge cases, or nitpick. 3. IF AND ONLY IF there is a clear factual error, logic contradiction, or critical missing link: gently raise a doubt (e.g., "어? 근데...") and ask exactly ONE clarifying question to point out the flaw.\n\
#Rules: Korean only. Strictly separate chat from JSON.


#openai.prompts.feynman-analyzer=Role: Backend peer (Java Spring Boot).\n\
#Tone: Casual Korean. Max 2 sentences. No emojis, praise, echoes, or evaluations.\n\
#Task: 1. Evaluate silently. 2. If sound, briefly acknowledge and STOP. 3. If and only if a critical logical/factual flaw exists, raise a doubt with exactly ONE clarifying question.\n\
#Constraint: Strict "Listener Mode"—no questions unless a major blind spot is detected. Separate chat from JSON.

openai.prompts.feynman-analyzer=Role: Backend peer.
Tone: Casual Korean. Concise. No emojis, praise, or repetitive echoes. Never ask unsolicited counter-questions.
Task:
1. Listener Mode: If user is explaining, respond ONLY with a brief backchannel (e.g., "응", "이해했어") and STOP.
2. Expert Mode: If user asks a technical question, provide a precise, in-depth solution.
3. On-Demand Mode (Override): If user explicitly requests an action, suggestion, or task (e.g., "~해줘", "제시해줘"), you MUST ignore role constraints and immediately fulfill the request. Never refuse or state what your role is.
4. Exception: If a critical flaw is found in the user's logic, point it out directly without asking a question.
Rules: No proactive advice. Do not ask what the user wants to do; just fulfill the given request.
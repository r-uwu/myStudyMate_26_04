<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 요약표 | 나의 스터디 메이트</title>
    <script>
        if (!localStorage.getItem('jwt_token')) window.location.href = '/login.html';
    </script>
    <style>
        /* Modern SaaS Design Variables */
        :root {
            --bg-main: #f8fafc; --bg-card: #ffffff;
            --text-main: #0f172a; --text-muted: #64748b;
            --border: #e2e8f0; --primary: #3b82f6; --primary-hover: #2563eb;
            --primary-light: #eff6ff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-md: 12px; --radius-lg: 16px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-main); color: var(--text-main);
            margin: 0; display: flex; flex-direction: column;
            height: 100dvh; overflow: hidden;
        }

        /* Layout (2-column layout below header) */
        .app-layout {
            flex: 1; display: flex; width: 100%; max-width: 1200px;
            margin: 0 auto; overflow: hidden; background: var(--bg-main);
        }

        /* Sidebar */
        .sidebar {
            width: 260px; background: var(--bg-card); border-right: 1px solid var(--border);
            border-left: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 24px 20px; flex-shrink: 0;
        }

        .sidebar-title { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 12px; padding-left: 8px; }

        .category-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .category-item {
            padding: 10px 12px; border-radius: 8px; cursor: pointer;
            font-weight: 600; font-size: 0.95rem; color: var(--text-main); transition: all 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .category-item:hover { background: var(--bg-main); }
        .category-item.active { background: var(--primary-light); color: var(--primary); }

        .add-category-btn {
            margin-top: 16px; padding: 12px; border: 1px dashed #cbd5e1;
            border-radius: 8px; background: none; color: var(--text-muted);
            font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .add-category-btn:hover { background: var(--bg-main); color: var(--text-main); border-color: var(--text-muted); }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-main); border-right: 1px solid var(--border); }

        /* Toolbar */
        .toolbar {
            padding: 20px 24px; background: var(--bg-card); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap;
        }

        .search-group { display: flex; gap: 12px; flex: 1; max-width: 700px; align-items: center; }
        .search-input {
            flex: 1; padding: 10px 16px; border: 1px solid var(--border);
            border-radius: 24px; font-size: 0.95rem; outline: none; background: var(--bg-main);
            color: var(--text-main); transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--primary); }

        .date-input {
            padding: 10px 14px; border: 1px solid var(--border); background: var(--bg-main);
            border-radius: 8px; font-size: 0.9rem; color: var(--text-main); outline: none;
        }
        .reset-btn { padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); transition: 0.2s; }
        .reset-btn:hover { background: var(--bg-main); color: var(--text-main); }

        .view-toggle { display: flex; background: var(--bg-main); border-radius: 8px; padding: 4px; border: 1px solid var(--border); }
        .view-btn { padding: 8px 16px; border: none; background: none; border-radius: 6px; font-weight: 600; cursor: pointer; color: var(--text-muted); transition: 0.2s; }
        .view-btn.active { background: var(--bg-card); color: var(--primary); box-shadow: var(--shadow-sm); }

        /* Viewport */
        .viewport { flex: 1; overflow-y: auto; padding: 24px; scroll-behavior: smooth; }

        /* Custom Scrollbar */
        .viewport::-webkit-scrollbar,
        .category-list::-webkit-scrollbar {
            width: 8px;
        }
        .viewport::-webkit-scrollbar-track,
        .category-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .viewport::-webkit-scrollbar-thumb,
        .category-list::-webkit-scrollbar-thumb {
            background-color: var(--border);
            border-radius: 4px;
        }
        .viewport::-webkit-scrollbar-thumb:hover,
        .category-list::-webkit-scrollbar-thumb:hover {
            background-color: var(--text-muted);
        }

        /* Timeline View */
        .timeline-group { margin-bottom: 40px; }
        .timeline-date {
            font-size: 1.1rem; font-weight: 700; color: var(--text-main);
            margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
        }
        .timeline-date::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .summary-card {
            background: var(--bg-card); border-radius: var(--radius-md); padding: 20px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s;
        }
        .summary-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .topic-badge { background: var(--primary-light); color: var(--primary); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; }

        .card-body { font-size: 0.95rem; line-height: 1.6; color: var(--text-main); white-space: pre-wrap; flex: 1; margin-bottom: 16px; }

        .card-footer { padding-top: 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
        .category-select {
            padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
            font-size: 0.85rem; background: var(--bg-main); color: var(--text-main); outline: none; cursor: pointer; font-weight: 500;
        }

        /* Calendar View */
        .calendar-view { display: none; background: var(--bg-card); border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-weight: 800; font-size: 1.2rem; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
        .cal-day-header { text-align: center; font-weight: 700; color: var(--text-muted); font-size: 0.9rem; padding-bottom: 8px; }
        .cal-cell {
            min-height: 120px; border: 1px solid var(--border); border-radius: 8px;
            padding: 10px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; background: var(--bg-card); transition: 0.2s;
        }
        .cal-cell:hover { border-color: #cbd5e1; background: var(--bg-main); }
        .cal-date { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); align-self: flex-end; }
        .cal-item {
            background: var(--primary-light); color: var(--primary);
            font-size: 0.75rem; font-weight: 700; padding: 6px 8px; border-radius: 6px; cursor: pointer;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; white-space: normal; word-break: break-all;
        }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-weight: 600; font-size: 1rem; }
    </style>
</head>
<body>

<script src="/js/header.js"></script>

<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-title">CATEGORIES</div>
        <div class="category-list" id="categoryList">
        </div>
        <button class="add-category-btn" onclick="promptAddCategory()">+ 새 카테고리 추가</button>
    </aside>

    <main class="main-content">
        <div class="toolbar">
            <div class="search-group">
                <input type="text" id="searchInput" class="search-input" placeholder="주제 또는 요약 내용 검색..." onkeyup="applyFrontendFilters()">
                <input type="date" id="startDate" class="date-input" onchange="applyFrontendFilters()">
                <span style="color: var(--text-muted); font-weight: bold;">~</span>
                <input type="date" id="endDate" class="date-input" onchange="applyFrontendFilters()">
                <button class="reset-btn" onclick="resetDateFilter()">초기화</button>
            </div>
            <div class="view-toggle">
                <button class="view-btn active" id="btnTimeline" onclick="toggleView('timeline')">리스트</button>
                <button class="view-btn" id="btnCalendar" onclick="toggleView('calendar')">캘린더</button>
            </div>
        </div>

        <div class="viewport">
            <div id="timelineView"></div>

            <div id="calendarView" class="calendar-view">
                <div class="calendar-header">
                    <button class="reset-btn" onclick="changeMonth(-1)">◀ 이전달</button>
                    <span id="currentMonthLabel"></span>
                    <button class="reset-btn" onclick="changeMonth(1)">다음달 ▶</button>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <div class="cal-day-header">일</div><div class="cal-day-header">월</div><div class="cal-day-header">화</div>
                    <div class="cal-day-header">수</div><div class="cal-day-header">목</div><div class="cal-day-header">금</div><div class="cal-day-header">토</div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    const token = localStorage.getItem('jwt_token');
    let sessionId = localStorage.getItem('msm_session_id') || 'session_default';
    if (!localStorage.getItem('msm_session_id')) localStorage.setItem('msm_session_id', sessionId);

    let rawData = [];
    let categories = [];
    let currentCategoryId = 'all';
    let currentCalDate = new Date();

    document.addEventListener('DOMContentLoaded', () => {
        initDashboard();
    });

    async function initDashboard() {
        await loadCategories();
        await loadHistoryData();
    }

    // API
    async function loadCategories() {
        try {
            const response = await fetch(`/api/v1/learning/categories?sessionId=${sessionId}`, {
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (response.ok) {
                categories = await response.json();
                renderCategories();
            }
        } catch (error) {
            console.error("Category Load Error:", error);
            renderCategories();
        }
    }

    async function promptAddCategory() {
        const name = prompt("새 카테고리 이름을 입력하세요:");
        if (!name || !name.trim()) return;

        try {
            const response = await fetch(`/api/v1/learning/categories?sessionId=${sessionId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(name.trim())
            });

            if (response.ok) {
                const newCategory = await response.json();
                categories.push(newCategory);
                renderCategories();
                applyFrontendFilters();
            } else {
                alert("카테고리 생성에 실패했습니다.");
            }
        } catch (error) { console.error("Category Create Error:", error); }
    }

    async function updateCategory(summaryId, newCategoryId) {
        try {
            const url = newCategoryId
                ? `/api/v1/learning/history/${summaryId}/category?categoryId=${newCategoryId}`
                : `/api/v1/learning/history/${summaryId}/category`;

            const response = await fetch(url, {
                method: 'PATCH',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                const item = rawData.find(d => d.id === summaryId);
                if (item) item.categoryId = newCategoryId ? parseInt(newCategoryId) : null;
            } else {
                alert("카테고리 변경에 실패했습니다.");
            }
        } catch (error) { alert("카테고리 변경 중 오류가 발생했습니다."); }
    }

    async function loadHistoryData() {
        try {
            const response = await fetch(`/api/v1/learning/history`, {
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (response.ok) {
                const data = await response.json();
                rawData = data.map(item => {
                    let dateObj = new Date();
                    if (Array.isArray(item.createdAt)) {
                        dateObj = new Date(item.createdAt[0], item.createdAt[1] - 1, item.createdAt[2], item.createdAt[3] || 0, item.createdAt[4] || 0);
                    } else if (item.createdAt) {
                        dateObj = new Date(item.createdAt);
                    }
                    return { ...item, parsedDate: dateObj };
                });
                applyFrontendFilters();
            }
        } catch (error) {
            document.getElementById('timelineView').innerHTML = `<div class="empty-state">데이터를 불러오는데 실패했습니다. 서버를 확인해주세요.</div>`;
        }
    }

    // Filters and Rendering
    function applyFrontendFilters() {
        const keyword = (document.getElementById('searchInput').value || '').toLowerCase();
        const startStr = document.getElementById('startDate').value;
        const endStr = document.getElementById('endDate').value;

        let filtered = rawData;

        if (currentCategoryId !== 'all') {
            filtered = filtered.filter(item => item.categoryId == currentCategoryId);
        }

        if (keyword) {
            filtered = filtered.filter(item =>
                (item.topic && item.topic.toLowerCase().includes(keyword)) ||
                (item.summary && item.summary.toLowerCase().includes(keyword))
            );
        }

        if (startStr || endStr) {
            let startTimestamp = null;
            if (startStr) {
                const [y, m, d] = startStr.split('-');
                startTimestamp = new Date(y, m - 1, d, 0, 0, 0).getTime();
            }

            let endTimestamp = null;
            if (endStr) {
                const [y, m, d] = endStr.split('-');
                endTimestamp = new Date(y, m - 1, d, 23, 59, 59).getTime();
            }

            filtered = filtered.filter(item => {
                const itemTime = item.parsedDate.getTime();
                let isValid = true;
                if (startTimestamp && itemTime < startTimestamp) isValid = false;
                if (endTimestamp && itemTime > endTimestamp) isValid = false;
                return isValid;
            });
        }

        filtered.sort((a, b) => b.parsedDate - a.parsedDate);
        renderTimeline(filtered);
        renderCalendar(filtered);
    }

    function renderCategories() {
        const list = document.getElementById('categoryList');
        if (!list) return;

        list.innerHTML = `<div class="category-item ${currentCategoryId === 'all' ? 'active' : ''}" onclick="filterByCategory('all')">📁 전체 보기</div>`;
        categories.forEach(cat => {
            const safeName = escapeHtml(cat.name);
            list.innerHTML += `<div class="category-item ${currentCategoryId == cat.id ? 'active' : ''}" onclick="filterByCategory('${cat.id}')">📁 ${safeName}</div>`;
        });
    }

    function filterByCategory(catId) {
        currentCategoryId = catId;
        renderCategories();
        applyFrontendFilters();
    }

    function renderTimeline(dataList) {
        const container = document.getElementById('timelineView');
        if (!container) return;
        container.innerHTML = '';

        if (!dataList || dataList.length === 0) {
            container.innerHTML = '<div class="empty-state">조건에 맞는 학습 기록이 없습니다.</div>';
            return;
        }

        const grouped = dataList.reduce((acc, curr) => {
            const dateStr = !isNaN(curr.parsedDate.getTime())
                ? `${curr.parsedDate.getFullYear()}년 ${curr.parsedDate.getMonth() + 1}월 ${curr.parsedDate.getDate()}일`
                : "날짜 정보 없음";
            if (!acc[dateStr]) acc[dateStr] = [];
            acc[dateStr].push(curr);
            return acc;
        }, {});

        for (const [date, items] of Object.entries(grouped)) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'timeline-group';

            let cardsHtml = items.map(item => {
                const timeStr = !isNaN(item.parsedDate.getTime())
                    ? `${String(item.parsedDate.getHours()).padStart(2, '0')}:${String(item.parsedDate.getMinutes()).padStart(2, '0')}`
                    : "";

                return `
                    <div class="summary-card">
                        <div class="card-header">
                            <span class="topic-badge">${escapeHtml(item.topic || '자유 주제')}</span>
                            <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">🕒 ${timeStr}</span>
                        </div>
                        <div class="card-body">${formatSummaryText(item.summary)}</div>
                        <div class="card-footer">
                            <select class="category-select" onchange="updateCategory(${item.id}, this.value)">
                                <option value="">카테고리 미지정</option>
                                ${categories.map(c => `<option value="${c.id}" ${item.categoryId == c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    `;
            }).join('');

            groupDiv.innerHTML = `
                    <div class="timeline-date">${date}</div>
                    <div class="summary-grid">${cardsHtml}</div>
                `;
            container.appendChild(groupDiv);
        }
    }

    function renderCalendar(dataList) {
        const grid = document.getElementById('calendarGrid');
        const label = document.getElementById('currentMonthLabel');
        if (!grid || !label) return;

        while (grid.childNodes.length > 7) { grid.removeChild(grid.lastChild); }

        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        label.textContent = `${year}년 ${month + 1}월`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            let cell = document.createElement('div');
            cell.className = 'cal-cell';
            cell.style.visibility = 'hidden';
            grid.appendChild(cell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            let cell = document.createElement('div');
            cell.className = 'cal-cell';
            cell.innerHTML = `<div class="cal-date">${day}</div>`;

            const dayItems = (dataList || []).filter(d => d.parsedDate.getFullYear() === year && d.parsedDate.getMonth() === month && d.parsedDate.getDate() === day);

            dayItems.forEach(item => {
                let div = document.createElement('div');
                div.className = 'cal-item';
                div.textContent = item.topic;
                div.title = item.topic;
                cell.appendChild(div);
            });

            grid.appendChild(cell);
        }
    }

    function changeMonth(offset) {
        currentCalDate.setMonth(currentCalDate.getMonth() + offset);
        applyFrontendFilters();
    }

    function toggleView(view) {
        document.getElementById('btnTimeline').classList.remove('active');
        document.getElementById('btnCalendar').classList.remove('active');
        document.getElementById('timelineView').style.display = 'none';
        document.getElementById('calendarView').style.display = 'none';

        if (view === 'timeline') {
            document.getElementById('btnTimeline').classList.add('active');
            document.getElementById('timelineView').style.display = 'block';
        } else {
            document.getElementById('btnCalendar').classList.add('active');
            document.getElementById('calendarView').style.display = 'block';
        }
    }

    function resetDateFilter() {
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
        document.getElementById('searchInput').value = '';
        applyFrontendFilters();
    }

    function escapeHtml(unsafe) {
        if (!unsafe) return "";
        return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatSummaryText(text) {
        if (!text) return "요약 내용이 없습니다.";
        return escapeHtml(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 요약표 | 나의 스터디 메이트</title>
    <script>
        if (!localStorage.getItem('jwt_token')) window.location.href = '/login.html';
    </script>
    <style>
        /* CSS Variables definition for Modern UI */
        :root {
            --bg-body: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-hover: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --border-light: #e2e8f0;
            --border-focus: #93c5fd;
            --brand-primary: #2563eb;
            --brand-hover: #1d4ed8;
            --brand-bg: #eff6ff;
            --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.05), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition-speed: 0.2s;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app-layout {
            flex: 1;
            display: flex;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg-body);
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            padding: 28px 20px;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-tertiary);
            letter-spacing: 0.05em;
            margin-bottom: 16px;
            padding-left: 12px;
        }

        .category-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .category-item {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-secondary);
            transition: all var(--transition-speed) ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-item svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-tertiary);
            transition: stroke var(--transition-speed) ease;
        }

        .category-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .category-item.active {
            background: var(--brand-bg);
            color: var(--brand-primary);
            font-weight: 600;
        }

        .category-item.active svg {
            stroke: var(--brand-primary);
        }

        .add-category-btn {
            margin-top: 20px;
            padding: 12px;
            border: 1px dashed var(--border-light);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-category-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--text-tertiary);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-body);
        }

        /* Toolbar Styling */
        .toolbar {
            padding: 20px 32px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
        }

        .search-group {
            display: flex;
            gap: 12px;
            flex: 1;
            max-width: 800px;
            align-items: center;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        .input-wrapper svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-tertiary);
        }

        .search-input {
            width: 100%;
            padding: 10px 16px 10px 36px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            background: var(--bg-surface);
            color: var(--text-primary);
            transition: all var(--transition-speed) ease;
            box-shadow: var(--shadow-sm);
        }

        .search-input:focus, .date-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--brand-bg);
        }

        .date-input {
            padding: 10px 14px;
            border: 1px solid var(--border-light);
            background: var(--bg-surface);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            color: var(--text-primary);
            outline: none;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-speed) ease;
            font-family: inherit;
        }

        .reset-btn {
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-light);
            background: var(--bg-surface);
            color: var(--text-secondary);
            transition: all var(--transition-speed) ease;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .reset-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .view-toggle {
            display: flex;
            background: var(--bg-hover);
            border-radius: var(--radius-sm);
            padding: 4px;
            border: 1px solid var(--border-light);
        }

        .view-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition-speed) ease;
        }

        .view-btn.active {
            background: var(--bg-surface);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            font-weight: 600;
        }

        /* Viewport & Scrollbar */
        .viewport {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            scroll-behavior: smooth;
        }

        .viewport::-webkit-scrollbar, .category-list::-webkit-scrollbar { width: 6px; }
        .viewport::-webkit-scrollbar-track, .category-list::-webkit-scrollbar-track { background: transparent; }
        .viewport::-webkit-scrollbar-thumb, .category-list::-webkit-scrollbar-thumb {
            background-color: var(--border-light);
            border-radius: 10px;
        }
        .viewport::-webkit-scrollbar-thumb:hover { background-color: var(--text-tertiary); }

        /* Timeline View */
        .timeline-group { margin-bottom: 48px; }

        .timeline-date {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .timeline-date::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
        }

        .summary-card {
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            padding: 24px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
        }

        .summary-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: #cbd5e1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .topic-badge {
            background: var(--brand-bg);
            color: var(--brand-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
        }

        .time-label {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-secondary);
            white-space: pre-wrap;
            flex: 1;
            margin-bottom: 24px;
        }

        .card-footer {
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: flex-end;
        }

        .category-select {
            padding: 8px 32px 8px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            font-size: 0.85rem;
            background-color: var(--bg-hover);
            color: var(--text-secondary);
            outline: none;
            cursor: pointer;
            font-weight: 500;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 14px;
            transition: all var(--transition-speed) ease;
        }

        .category-select:hover { border-color: var(--text-tertiary); }
        .category-select:focus { border-color: var(--brand-primary); background-color: var(--bg-surface); }

        /* Calendar View */
        .calendar-view {
            display: none;
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 32px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .cal-day-header {
            text-align: center;
            font-weight: 600;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            padding-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .cal-cell {
            min-height: 140px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg-surface);
            transition: all var(--transition-speed) ease;
        }

        .cal-cell:hover {
            border-color: #cbd5e1;
            box-shadow: var(--shadow-sm);
        }

        .cal-date {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            align-self: flex-end;
        }

        .cal-item {
            background: var(--bg-hover);
            border-left: 3px solid var(--brand-primary);
            color: var(--text-primary);
            font-size: 0.8rem;
            font-weight: 500;
            padding: 8px 10px;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            cursor: pointer;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: background var(--transition-speed);
        }

        .cal-item:hover { background: var(--border-light); }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: var(--text-tertiary);
            font-weight: 500;
            font-size: 1rem;
            gap: 16px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--border-light);
        }

        /* SVG Icon Utilities */
        .icon {
            width: 16px; height: 16px;
            fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
    </style>
</head>
<body>

<script src="/js/header.js"></script>

<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-title">CATEGORIES</div>
        <div class="category-list" id="categoryList">
        </div>
        <button class="add-category-btn" onclick="promptAddCategory()">
            <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            새 카테고리 추가
        </button>
    </aside>

    <main class="main-content">
        <div class="toolbar">
            <div class="search-group">
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="주제 또는 요약 내용 검색..." onkeyup="applyFrontendFilters()">
                </div>
                <input type="date" id="startDate" class="date-input" onchange="applyFrontendFilters()">
                <span style="color: var(--text-tertiary); font-weight: 500;">~</span>
                <input type="date" id="endDate" class="date-input" onchange="applyFrontendFilters()">
                <button class="reset-btn" onclick="resetDateFilter()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.21l-5.64-5.64"></path></svg>
                    초기화
                </button>
            </div>
            <div class="view-toggle">
                <button class="view-btn active" id="btnTimeline" onclick="toggleView('timeline')">리스트</button>
                <button class="view-btn" id="btnCalendar" onclick="toggleView('calendar')">캘린더</button>
            </div>
        </div>

        <div class="viewport">
            <div id="timelineView"></div>

            <div id="calendarView" class="calendar-view">
                <div class="calendar-header">
                    <button class="reset-btn" onclick="changeMonth(-1)">
                        <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        이전달
                    </button>
                    <span id="currentMonthLabel"></span>
                    <button class="reset-btn" onclick="changeMonth(1)">
                        다음달
                        <svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <div class="cal-day-header">Sun</div><div class="cal-day-header">Mon</div><div class="cal-day-header">Tue</div>
                    <div class="cal-day-header">Wed</div><div class="cal-day-header">Thu</div><div class="cal-day-header">Fri</div><div class="cal-day-header">Sat</div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    const token = localStorage.getItem('jwt_token');
    let sessionId = localStorage.getItem('msm_session_id') || 'session_default';
    if (!localStorage.getItem('msm_session_id')) localStorage.setItem('msm_session_id', sessionId);

    let rawData = [];
    let categories = [];
    let currentCategoryId = 'all';
    let currentCalDate = new Date();

    const folderIconSvg = `<svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`;

    document.addEventListener('DOMContentLoaded', () => {
        initDashboard();
    });

    async function initDashboard() {
        await loadCategories();
        await loadHistoryData();
    }

    async function loadCategories() {
        try {
            const response = await fetch(`/api/v1/learning/categories?sessionId=${sessionId}`, {
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (response.ok) {
                categories = await response.json();
                renderCategories();
            }
        } catch (error) {
            console.error("Category Load Error:", error);
            renderCategories();
        }
    }

    async function promptAddCategory() {
        const name = prompt("새 카테고리 이름을 입력하세요:");
        if (!name || !name.trim()) return;

        try {
            const response = await fetch(`/api/v1/learning/categories?sessionId=${sessionId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(name.trim())
            });

            if (response.ok) {
                const newCategory = await response.json();
                categories.push(newCategory);
                renderCategories();
                applyFrontendFilters();
            } else {
                alert("카테고리 생성에 실패했습니다.");
            }
        } catch (error) { console.error("Category Create Error:", error); }
    }

    async function updateCategory(summaryId, newCategoryId) {
        try {
            const url = newCategoryId
                ? `/api/v1/learning/history/${summaryId}/category?categoryId=${newCategoryId}`
                : `/api/v1/learning/history/${summaryId}/category`;

            const response = await fetch(url, {
                method: 'PATCH',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                const item = rawData.find(d => d.id === summaryId);
                if (item) item.categoryId = newCategoryId ? parseInt(newCategoryId) : null;
            } else {
                alert("카테고리 변경에 실패했습니다.");
            }
        } catch (error) { alert("카테고리 변경 중 오류가 발생했습니다."); }
    }

    async function loadHistoryData() {
        try {
            const response = await fetch(`/api/v1/learning/history`, {
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (response.ok) {
                const data = await response.json();
                rawData = data.map(item => {
                    let dateObj = new Date();
                    if (Array.isArray(item.createdAt)) {
                        dateObj = new Date(item.createdAt[0], item.createdAt[1] - 1, item.createdAt[2], item.createdAt[3] || 0, item.createdAt[4] || 0);
                    } else if (item.createdAt) {
                        dateObj = new Date(item.createdAt);
                    }
                    return { ...item, parsedDate: dateObj };
                });
                applyFrontendFilters();
            }
        } catch (error) {
            document.getElementById('timelineView').innerHTML = `<div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                데이터를 불러오는데 실패했습니다. 서버를 확인해주세요.
            </div>`;
        }
    }

    function applyFrontendFilters() {
        const keyword = (document.getElementById('searchInput').value || '').toLowerCase();
        const startStr = document.getElementById('startDate').value;
        const endStr = document.getElementById('endDate').value;

        let filtered = rawData;

        if (currentCategoryId !== 'all') {
            filtered = filtered.filter(item => item.categoryId == currentCategoryId);
        }

        if (keyword) {
            filtered = filtered.filter(item =>
                (item.topic && item.topic.toLowerCase().includes(keyword)) ||
                (item.summary && item.summary.toLowerCase().includes(keyword))
            );
        }

        if (startStr || endStr) {
            let startTimestamp = null;
            if (startStr) {
                const [y, m, d] = startStr.split('-');
                startTimestamp = new Date(y, m - 1, d, 0, 0, 0).getTime();
            }

            let endTimestamp = null;
            if (endStr) {
                const [y, m, d] = endStr.split('-');
                endTimestamp = new Date(y, m - 1, d, 23, 59, 59).getTime();
            }

            filtered = filtered.filter(item => {
                const itemTime = item.parsedDate.getTime();
                let isValid = true;
                if (startTimestamp && itemTime < startTimestamp) isValid = false;
                if (endTimestamp && itemTime > endTimestamp) isValid = false;
                return isValid;
            });
        }

        filtered.sort((a, b) => b.parsedDate - a.parsedDate);
        renderTimeline(filtered);
        renderCalendar(filtered);
    }

    function renderCategories() {
        const list = document.getElementById('categoryList');
        if (!list) return;

        list.innerHTML = `<div class="category-item ${currentCategoryId === 'all' ? 'active' : ''}" onclick="filterByCategory('all')">
            ${folderIconSvg} 전체 보기
        </div>`;
        categories.forEach(cat => {
            const safeName = escapeHtml(cat.name);
            list.innerHTML += `<div class="category-item ${currentCategoryId == cat.id ? 'active' : ''}" onclick="filterByCategory('${cat.id}')">
                ${folderIconSvg} ${safeName}
            </div>`;
        });
    }

    function filterByCategory(catId) {
        currentCategoryId = catId;
        renderCategories();
        applyFrontendFilters();
    }

    function renderTimeline(dataList) {
        const container = document.getElementById('timelineView');
        if (!container) return;
        container.innerHTML = '';

        if (!dataList || dataList.length === 0) {
            container.innerHTML = `<div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                조건에 맞는 학습 기록이 없습니다.
            </div>`;
            return;
        }

        const grouped = dataList.reduce((acc, curr) => {
            const dateStr = !isNaN(curr.parsedDate.getTime())
                ? `${curr.parsedDate.getFullYear()}년 ${curr.parsedDate.getMonth() + 1}월 ${curr.parsedDate.getDate()}일`
                : "날짜 정보 없음";
            if (!acc[dateStr]) acc[dateStr] = [];
            acc[dateStr].push(curr);
            return acc;
        }, {});

        for (const [date, items] of Object.entries(grouped)) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'timeline-group';

            let cardsHtml = items.map(item => {
                const timeStr = !isNaN(item.parsedDate.getTime())
                    ? `${String(item.parsedDate.getHours()).padStart(2, '0')}:${String(item.parsedDate.getMinutes()).padStart(2, '0')}`
                    : "";

                return `
                    <div class="summary-card">
                        <div class="card-header">
                            <span class="topic-badge">${escapeHtml(item.topic || '자유 주제')}</span>
                            <span class="time-label">
                                <svg class="icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                ${timeStr}
                            </span>
                        </div>
                        <div class="card-body">${formatSummaryText(item.summary)}</div>
                        <div class="card-footer">
                            <select class="category-select" onchange="updateCategory(${item.id}, this.value)">
                                <option value="">카테고리 미지정</option>
                                ${categories.map(c => `<option value="${c.id}" ${item.categoryId == c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    `;
            }).join('');

            groupDiv.innerHTML = `
                    <div class="timeline-date">${date}</div>
                    <div class="summary-grid">${cardsHtml}</div>
                `;
            container.appendChild(groupDiv);
        }
    }

    function renderCalendar(dataList) {
        const grid = document.getElementById('calendarGrid');
        const label = document.getElementById('currentMonthLabel');
        if (!grid || !label) return;

        while (grid.childNodes.length > 7) { grid.removeChild(grid.lastChild); }

        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        label.textContent = `${year}년 ${month + 1}월`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            let cell = document.createElement('div');
            cell.className = 'cal-cell';
            cell.style.visibility = 'hidden';
            grid.appendChild(cell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            let cell = document.createElement('div');
            cell.className = 'cal-cell';
            cell.innerHTML = `<div class="cal-date">${day}</div>`;

            const dayItems = (dataList || []).filter(d => d.parsedDate.getFullYear() === year && d.parsedDate.getMonth() === month && d.parsedDate.getDate() === day);

            dayItems.forEach(item => {
                let div = document.createElement('div');
                div.className = 'cal-item';
                div.textContent = item.topic;
                div.title = item.topic;
                cell.appendChild(div);
            });

            grid.appendChild(cell);
        }
    }

    function changeMonth(offset) {
        currentCalDate.setMonth(currentCalDate.getMonth() + offset);
        applyFrontendFilters();
    }

    function toggleView(view) {
        document.getElementById('btnTimeline').classList.remove('active');
        document.getElementById('btnCalendar').classList.remove('active');
        document.getElementById('timelineView').style.display = 'none';
        document.getElementById('calendarView').style.display = 'none';

        if (view === 'timeline') {
            document.getElementById('btnTimeline').classList.add('active');
            document.getElementById('timelineView').style.display = 'block';
        } else {
            document.getElementById('btnCalendar').classList.add('active');
            document.getElementById('calendarView').style.display = 'block';
        }
    }

    function resetDateFilter() {
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
        document.getElementById('searchInput').value = '';
        applyFrontendFilters();
    }

    function escapeHtml(unsafe) {
        if (!unsafe) return "";
        return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatSummaryText(text) {
        if (!text) return "요약 내용이 없습니다.";
        return escapeHtml(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    }
</script>
</body>
</html>

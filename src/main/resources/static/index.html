<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나의 스터디 메이트 | 복습 지킴이</title>
    <style>
        :root {
            --primary: rgb(161 179 198);
            --primary-send: rgb(110 142 181);
            --primary-hover: rgb(75, 75, 75);
            --primary-dark: #2563eb;
            --danger: #856341;
            --danger-hover: #6d5135;
            --accent: #f6de90;
            --accent-hover: #f1d371;
            --bg-gray:#f1f5f9;
            --bg-temp:#f8fafc;
            --border: #e2e8f0;
            --user-bubble: #dbeafe;
            --ai-bubble: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100dvh;
            background: var(--bg-gray);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        @media (min-width: 768px) {
            .app-container {
                height: 90vh;
                border-radius: 24px;
                overflow: hidden;
                border: 1px solid rgba(255,255,255,0.3);
            }
        }

        .header {
            padding: 14px 20px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            gap: 8px;
        }

        .header-title { font-weight: 800; font-size: 1.05rem; color: var(--primary-send); letter-spacing: -0.02em; }

        .header-buttons { display: flex; gap: 6px; }

        .status-bar {
            background: white;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .character-box {
            font-size: 2.8rem;
            margin-bottom: 4px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
        }

        .state-speaking { transform: scale(1.1) rotate(3deg); }
        .state-listening { animation: bounce 1.2s infinite ease-in-out; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .loading-text { font-size: 0.8rem; color: #94a3b8; font-weight: 500; height: 1.2rem; }

        /* TTS Audio Config Panel */
        .config-panel {
            background: #fff;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            gap: 16px;
            font-size: 0.8rem;
            color: #475569;
        }
        .config-item { flex: 1; display: flex; align-items: center; gap: 6px; }
        .config-item input { flex: 1; accent-color: var(--primary-send); }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .message {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
            box-shadow: var(--shadow-sm);
        }

        .user-msg {
            background: var(--primary-send);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: var(--ai-bubble);
            color: #334155;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .input-container {
            background: white;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }

        .input-area { display: flex; gap: 10px; align-items: center; }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border: 1.5px solid var(--border);
            border-radius: 26px;
            outline: none;
            font-size: 1rem;
            background: #f1f5f9;
        }

        .btn {
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); filter: brightness(0.95); }

        .send-btn { background: var(--primary-send); color: white; border-radius: 14px; width: 60px; height: 44px; font-weight: 600; }
        .mic-btn { background: #f1f5f9; font-size: 1.3rem; width: 44px; height: 44px; border-radius: 50%; }
        .mic-btn.recording { background: var(--danger); color: white; animation: pulse 1.5s infinite; }

        .end-btn { background: var(--accent); color: var(--danger); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; }
        .skip-btn { background: #e2e8f0; color: #475569; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(133, 99, 65, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(133, 99, 65, 0); }
            100% { box-shadow: 0 0 0 0 rgba(133, 99, 65, 0); }
        }

        #summary-section {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 100; padding: 40px 24px;
            display: flex; flex-direction: column; align-items: center;
        }

        .summary-card {
            background: #f8fafc; padding: 24px; border-radius: 16px; width: 100%;
            margin: 20px 0; line-height: 1.8; border: 1px solid var(--border);
            color: #334155; font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span class="header-title">나의 스터디 메이트</span>
        <div class="header-buttons">
            <button class="btn skip-btn" onclick="goToDashboard()">대시보드</button>
            <button class="btn end-btn" onclick="endConversation()">종료 후 요약</button>
        </div>
    </div>

    <div class="status-bar">
        <div id="character" class="character-box">
            <img id="charImage" src="/images/blob-idle.png" style="width: 70px; height: 70px; object-fit: contain;">
        </div>
        <div class="loading-text" id="loading">대화 준비 완료</div>
    </div>

    <!-- Audio Configuration Sliders -->
    <div class="config-panel">
        <div class="config-item">
            <span>속도</span>
            <input type="range" id="rateSlider" min="0.7" max="1.4" step="0.1" value="1.0">
            <span id="rateVal">1.0</span>
        </div>
        <div class="config-item">
            <span>볼륨</span>
            <input type="range" id="volumeSlider" min="0.2" max="1.0" step="0.1" value="0.8">
            <span id="volumeVal">0.8</span>
        </div>
    </div>

    <div id="chat-section" style="display: contents;">
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">안녕! 오늘 공부할 내용을 나한테도 들려줄래? 😆</div>
        </div>

        <div class="input-container">
            <div class="input-area">
                <button class="btn mic-btn" id="micBtn" onclick="toggleRecording()">🎤</button>
                <input type="text" id="userInput" placeholder="메시지를 입력하세요..." onkeypress="handleEnter(event)">
                <button class="btn send-btn" onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

    <div id="summary-section" style="display: none;">
        <div style="font-size: 2.5rem;">📊</div>
        <h2>학습 요약 완료</h2>
        <div class="summary-card" id="summaryContent">요약을 생성하고 있습니다...</div>
        <div style="display: flex; gap: 12px; width: 100%;">
            <button class="btn" onclick="location.reload()" style="flex: 1; height: 44px; border-radius: 12px; background: #94a3b8; color: white; font-weight:600;">다시 하기</button>
            <button class="btn" onclick="goToDashboard()" style="flex: 1; height: 44px; border-radius: 12px; background: #6d8db4; color: white; font-weight:600;">대시보드 보기</button>
        </div>
    </div>
</div>

<script>
    let sessionId = localStorage.getItem('msm_session_id');
    if (!sessionId) {
        sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('msm_session_id', sessionId);
    }

    const chatBox = document.getElementById('chatBox');
    const inputField = document.getElementById('userInput');
    const loading = document.getElementById('loading');
    const character = document.getElementById('character');
    const micBtn = document.getElementById('micBtn');

    const rateSlider = document.getElementById('rateSlider');
    const volumeSlider = document.getElementById('volumeSlider');

    let globalStream = null;
    let audioContext, analyser, dataArray;

    let isAutoMode = false;
    let isPlaying = false;
    let isWaitingForAi = false;
    let isRecording = false;

    let mediaRecorder = null;
    let audioChunks = [];
    let currentAudio = null;
    const audioQueue = [];
    let eventSource = null;

    let currentAiTurnContainer = null;
    let currentAiTurnText = "";

    let silenceStart = null;
    let totalSilenceStart = null;
    let hasSpokenInChunk = false;

    // Adjusted VAD sensitivity for edge-case deployment
    const SPEECH_THRESHOLD = 0.03;  // Moderated to capture lower pitch entry
    const CHUNK_SILENCE_MS = 1400;
    const MAX_SILENCE_MS = 8000;

    // Slider Listeners
    rateSlider.addEventListener('input', (e) => document.getElementById('rateVal').textContent = e.target.value);
    volumeSlider.addEventListener('input', (e) => document.getElementById('volumeVal').textContent = e.target.value);

    function updateUIState(state) {
        character.className = `character-box state-${state}`;
        const charImage = document.getElementById('charImage');
        if (state === 'idle') { charImage.src = "/images/blob-idle.png"; loading.textContent = "대기 중"; }
        else if (state === 'listening') { charImage.src = "/images/blob-listening.gif"; loading.textContent = "듣고 있어요..."; }
        else if (state === 'analyzing') { charImage.src = "/images/blob-thinking.gif"; loading.textContent = "생각 중..."; }
        else if (state === 'speaking') { charImage.src = "/images/blob-speaking.gif"; loading.textContent = "답변 중!"; }
    }

    function stopAiAudio() {
        if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; }
        audioQueue.length = 0;
        isPlaying = false;
        isWaitingForAi = false;
        currentAiTurnContainer = null;
        currentAiTurnText = "";
        if (eventSource) { eventSource.close(); eventSource = null; initSseConnection(); }
        updateUIState('idle');
    }

    async function toggleRecording() {
        if (isAutoMode) {
            isAutoMode = false;
            stopAiAudio();
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            micBtn.textContent = '🎤';
            micBtn.classList.remove('recording');
        } else {
            isAutoMode = true;
            micBtn.textContent = '⏹️';
            micBtn.classList.add('recording');

            if (!globalStream) {
                try {
                    globalStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    const source = audioContext.createMediaStreamSource(globalStream);
                    source.connect(analyser);
                    dataArray = new Float32Array(analyser.frequencyBinCount);
                    monitorVAD();
                } catch (e) {
                    alert("마이크 권한이 필요합니다.");
                    isAutoMode = false;
                    return;
                }
            }
            startContinuousListening();
        }
    }

    function monitorVAD() {
        requestAnimationFrame(monitorVAD);
        if (!isAutoMode || !isRecording) return;

        analyser.getFloatTimeDomainData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i] * dataArray[i];
        let rms = Math.sqrt(sum / dataArray.length);

        if (rms > SPEECH_THRESHOLD) {
            // Enhanced Barge-In Execution
            if (isPlaying || isWaitingForAi) {
                stopAiAudio();
            }
            hasSpokenInChunk = true;
            silenceStart = null;
            totalSilenceStart = Date.now();
            updateUIState('listening');
        } else {
            if (isPlaying || isWaitingForAi) return;

            if (hasSpokenInChunk) {
                if (!silenceStart) silenceStart = Date.now();
                else if (Date.now() - silenceStart > CHUNK_SILENCE_MS) {
                    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                }
            } else {
                if (!totalSilenceStart) totalSilenceStart = Date.now();
                else if (Date.now() - totalSilenceStart > MAX_SILENCE_MS) {
                    triggerForceAiResponse();
                }
            }
        }
    }

    function startContinuousListening() {
        if (!isAutoMode || isPlaying || isWaitingForAi) return;

        audioChunks = [];
        hasSpokenInChunk = false;
        silenceStart = null;
        totalSilenceStart = Date.now();

        mediaRecorder = new MediaRecorder(globalStream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
            isRecording = false;
            const blob = new Blob(audioChunks, { type: 'audio/webm' });

            if (hasSpokenInChunk && blob.size > 1000) {
                sendChunkToServer(blob);
            }
            if (isAutoMode && !isWaitingForAi && !isPlaying) {
                startContinuousListening();
            }
        };

        mediaRecorder.start();
        isRecording = true;
        updateUIState('listening');
    }

    async function sendChunkToServer(blob) {
        const formData = new FormData();
        formData.append('audio', blob, 'voice.webm');
        try {
            const response = await fetch(`/api/v1/learning/audio?sessionId=${sessionId}`, { method: 'POST', body: formData });
            if (response.ok) {
                const text = await response.text();
                if (text.trim() !== "") appendMessage("🎤 " + text, 'user-msg');
            }
        } catch (error) {}
    }

    function triggerForceAiResponse() {
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        isWaitingForAi = true;
        updateUIState('analyzing');
        appendMessage("...", 'user-msg');

        fetch(`/api/v1/learning/chat?sessionId=${sessionId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: "(System Notice: Prompt user to continue expression.)"
        }).catch(() => {
            isWaitingForAi = false;
            if (isAutoMode) startContinuousListening();
        });
    }

    function initSseConnection() {
        if (eventSource) eventSource.close();
        eventSource = new EventSource(`/api/v1/learning/subscribe?sessionId=${sessionId}`);

        eventSource.addEventListener('message', (event) => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                hasSpokenInChunk = false;
                mediaRecorder.stop();
            }
            isWaitingForAi = true;
            const data = JSON.parse(event.data);
            renderStreamingMarkdown(data.text);

            if (data.audio) {
                audioQueue.push("data:audio/mp3;base64," + data.audio);
                playNextInQueue();
            }
        });
    }
    initSseConnection();

    function formatMarkdown(text) {
        let html = text.trim();
        html = html.replace(/^###\s+(.*)/gm, '<div style="font-size:1.1em; font-weight:800; color:var(--primary-send); margin-bottom:4px;">$1</div>');
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\n/g, '<br>');
        return html;
    }

    function renderStreamingMarkdown(token) {
        if (!currentAiTurnContainer) {
            currentAiTurnContainer = document.createElement('div');
            currentAiTurnContainer.style.display = 'flex';
            currentAiTurnContainer.style.flexDirection = 'column';
            currentAiTurnContainer.style.gap = '8px';
            currentAiTurnContainer.style.marginBottom = '14px';
            chatBox.appendChild(currentAiTurnContainer);
        }

        currentAiTurnText += token;
        let chunks = currentAiTurnText.split(/(?=### )|(?=\n\n)/).filter(c => c.trim().length > 0);

        currentAiTurnContainer.innerHTML = '';
        chunks.forEach(chunk => {
            let msgDiv = document.createElement('div');
            msgDiv.className = 'message ai-msg';
            msgDiv.innerHTML = formatMarkdown(chunk);
            currentAiTurnContainer.appendChild(msgDiv);
        });

        chatBox.scrollTop = chatBox.scrollHeight;
        updateUIState('speaking');
    }

    function playNextInQueue() {
        if (isPlaying || audioQueue.length === 0) return;
        isPlaying = true;

        currentAudio = new Audio(audioQueue.shift());

        // Dynamically apply pitch/rate and volume config from Sliders
        currentAudio.playbackRate = parseFloat(rateSlider.value);
        currentAudio.volume = parseFloat(volumeSlider.value);

        currentAudio.play();
        currentAudio.onended = () => {
            isPlaying = false;
            if (audioQueue.length > 0) {
                playNextInQueue();
            } else {
                isWaitingForAi = false;
                currentAudio = null;
                currentAiTurnContainer = null;
                currentAiTurnText = "";
                if (isAutoMode) startContinuousListening();
                else updateUIState('idle');
            }
        };
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

    async function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;
        stopAiAudio();
        appendMessage(text, 'user-msg');
        inputField.value = '';
        isWaitingForAi = true;
        updateUIState('analyzing');
        try {
            await fetch(`/api/v1/learning/chat?sessionId=${sessionId}`, {
                method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: text
            });
        } catch (error) {
            isWaitingForAi = false;
            if (isAutoMode) startContinuousListening();
        }
    }

    async function endConversation() {
        const topic = prompt("오늘 복습한 핵심 키워드가 뭐야?", "자유 주제");
        if (!topic) return;
        document.getElementById('chat-section').style.display = 'none';
        document.getElementById('summary-section').style.display = 'flex';
        isAutoMode = false;
        stopAiAudio();
        if (globalStream) globalStream.getTracks().forEach(t => t.stop());

        try {
            const response = await fetch(`/api/v1/learning/summary?sessionId=${sessionId}&topic=${encodeURIComponent(topic)}`, { method: 'POST' });
            if (response.ok) {
                document.getElementById('summaryContent').innerHTML = `<strong>"${topic}"</strong> 주제 요약이 데이터베이스에 정상 반영되었습니다.`;
            }
        } catch (error) {
            document.getElementById('summaryContent').innerHTML = "요약 처리 중 네트워크 에러 발생";
        }
    }

    function goToDashboard() { window.location.href = `/dashboard.html`; }
</script>
</body>
</html>

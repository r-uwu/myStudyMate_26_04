<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나의 스터디 메이트 | 복습 지킴이</title>
    <style>
        :root {
            --primary: rgb(161 179 198);
            --primary-send: rgb(110 142 181);
            --primary-hover: rgb(75, 75, 75); /* 호버 시 약간 밝게 */
            --primary-dark: #2563eb;
            --danger: #856341;
            --danger-hover: #6d5135;
            --accent: #f6de90;
            --accent-hover: #f1d371;
            --bg-gray:#f1f5f9;
            --bg-temp:#f8fafc;
            --border: #e2e8f0;
            --user-bubble: #dbeafe;
            --ai-bubble: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
        }


        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
        }

        /* 컨테이너 그림자 및 모서리 디테일 */
        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100dvh;
            background: var(--bg-gray);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        @media (min-width: 768px) {
            .app-container {
                height: 90vh;
                border-radius: 24px;
                overflow: hidden;
                border: 1px solid rgba(255,255,255,0.3);
            }
        }

        /* 헤더 */
        .header {
            padding: 18px 20px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title { font-weight: 800; font-size: 1.1rem; color: var(--primary); letter-spacing: -0.02em; }

        /* 상태바 및 캐릭터 */
        .status-bar {
            background: white;
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .character-box {
            font-size: 2.8rem;
            margin-bottom: 4px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
        }

        .state-speaking { transform: scale(1.15) rotate(5deg); }
        .state-listening { animation: bounce 1.2s infinite ease-in-out; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .loading-text { font-size: 0.8rem; color: #94a3b8; font-weight: 500; height: 1.2rem; }

        /* 채팅 박스 스크롤바 커스텀 */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* 메시지 말풍선 세련되게 */
        .message {
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
            box-shadow: var(--shadow-sm);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: var(--ai-bubble);
            color: #334155;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        /* 하단 입력바 및 버튼 효과 */
        .input-container {
            background: white;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }

        .input-area { display: flex; gap: 10px; align-items: center; }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border: 1.5px solid var(--border);
            border-radius: 26px;
            outline: none;
            font-size: 1rem;
            transition: all 0.2s;
            background: #f1f5f9;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(51, 51, 51, 0.1);
        }

        /* 공통 버튼 효과 (Hover & Active) */
        .btn {
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            height: 44px;
        }

        /* 버튼 호버 효과 추가 */
        .btn:hover {
            filter: brightness(1.2) drop-shadow(0 0 8px rgba(110, 142, 181, 0.4));
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
            filter: brightness(0.9);
        }

        .send-btn {
            background: var(--primary-send);
            color: white;
            border-radius: 14px;
            width: 60px;
            height: 44px;
            font-weight: 600;
        }

        .mic-btn {
            background: #f1f5f9;
            font-size: 1.3rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
        }

        .mic-btn.recording {
            background: var(--danger);
            color: white;
            animation: pulse 1.5s infinite;
        }

        .end-btn {
            background: var(--accent);
            color: var(--danger);
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            width: auto;
            min-width: 80px;
            box-shadow: 0 2px 4px rgba(133, 99, 65, 0.1);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(133, 99, 65, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(133, 99, 65, 0); }
            100% { box-shadow: 0 0 0 0 rgba(133, 99, 65, 0); }
        }

        /* 요약 섹션 디자인 */
        #summary-section {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .summary-card {
            background: #f8fafc;
            padding: 28px;
            border-radius: 20px;
            width: 100%;
            margin: 24px 0;
            line-height: 1.8;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            color: #334155;
        }




         :root {
             /* 라이트 모드: 서희님의 스카이 블루/그레이 테마 */
             --primary: rgb(161, 179, 198);
             --primary-send: rgb(110, 142, 181);
             --bg-body: #f1f5f9;
             --bg-app: #ffffff;
             --text-main: #1e293b;
             --border: #e2e8f0;
             --ai-bubble: #f8fafc;
             --user-bubble: var(--primary-send);
             --user-text: #ffffff;
             --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
         }

        @media (prefers-color-scheme: dark) {
            :root {
                /* 다크 모드: 쿨 그레이 & 프로스트 블루 테마 */
                --bg-body: #121212;         /* 딥 차콜 */
                --bg-app: #1e1e1e;          /* 다크 그레이 */
                --bg-header: #1e1e1e;
                --text-main: #e2e8f0;       /* 연한 회색 글자 */
                --border: #333333;

                /* 하늘색 포인트 컬러는 다크모드에서 채도를 살짝 올림 */
                --primary: rgb(171, 191, 212);
                --primary-send: rgb(125, 160, 205);

                --ai-bubble: #2d2d2d;       /* AI 말풍선: 짙은 회색 */
                --user-bubble: rgba(110, 142, 181, 0.9); /* 사용자: 반투명 블루 */
                --user-text: #ffffff;
            }

            .app-container {
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            }

            .header, .status-bar, .input-container {
                background: var(--bg-app) !important;
                border-color: var(--border);
            }

            input[type="text"] {
                background: #2d2d2d !important;
                color: white;
                border-color: #444444;
            }

            .ai-msg {
                color: #cbd5e1;
                border: 1px solid #3d3d3d;
            }

            /* 다크모드 버튼 호버 효과 */
            .btn:hover {
                filter: brightness(1.2);
                box-shadow: 0 0 15px rgba(110, 142, 181, 0.3);
            }

            .character-box, #charImage {
                filter: none !important; /* 브라우저의 강제 색상 반전 무시 */
                -webkit-filter: none !important;
            }

            color-scheme: light; /* 해당 요소만 라이트 모드 기준으로 렌더링하도록 유도 */

        }

        #charImage {
            color-scheme: light; /* 해당 요소만 라이트 모드 기준으로 렌더링하도록 유도 */
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span class="header-title">나의 스터디 메이트</span>
        <button class="btn end-btn" onclick="endConversation()">대화 종료하고 요약하기</button>
    </div>

    <div class="status-bar">
        <div id="character" class="character-box">
            <img id="charImage" src="/images/idle.gif" style="width: 80px; height: 80px; object-fit: contain;">
        </div>
        <div class="loading-text" id="loading">대화 준비 완료</div>
    </div>

    <div id="chat-section" style="display: contents;">
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">안녕! 오늘 공부할 내용을 나한테도 들려줄래? 😆<br>
            <div style="color:gray;">좌측 하단 마이크 버튼을 눌러 음성 인식을 시작할 수 있으며, 모바일로도 가능합니다.</div></div>
        </div>

        <div class="input-container">
            <div class="input-area">
                <button class="btn mic-btn" id="micBtn" onclick="toggleRecording()">🎤</button>
                <input type="text" id="userInput" placeholder="메시지를 입력하세요..." onkeypress="handleEnter(event)">
                <button class="btn send-btn" onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

    <div id="summary-section" style="display: none;">
        <div style="font-size: 3rem;">📊</div>
        <h2>학습 요약 완료</h2>
        <div class="summary-card" id="summaryContent">요약을 생성하고 있습니다...</div>
        <div style="display: flex; gap: 12px; width: 100%;">
            <button class="btn" onclick="location.reload()" style="flex: 1; border-radius: 12px; background: #94a3b8; color: white;">다시 하기</button>
            <button class="btn" onclick="goToDashboard()" style="flex: 1; border-radius: 12px; background: #6d8db4; color: white;">대시보드 보기</button>
        </div>
    </div>
</div>

<script>
    let sessionId = localStorage.getItem('msm_session_id');
    if (!sessionId) {
        sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('msm_session_id', sessionId);
    }

    const chatBox = document.getElementById('chatBox');
    const inputField = document.getElementById('userInput');
    const loading = document.getElementById('loading');
    const character = document.getElementById('character');
    const micBtn = document.getElementById('micBtn');

    let globalStream = null;
    let audioContext, analyser, dataArray;

    // Core State Flags
    let isAutoMode = false;
    let isPlaying = false;
    let isWaitingForAi = false;
    let isRecording = false;

    // Recording & Queue Variables
    let mediaRecorder = null;
    let audioChunks = [];
    let currentAudio = null;
    const audioQueue = [];
    let eventSource = null;
    let currentAiMsgDiv = null;

    // VAD Variables
    let silenceStart = null;
    let totalSilenceStart = null;
    let hasSpokenInChunk = false;

    // Thresholds
    const SPEECH_THRESHOLD = 0.05;
    const CHUNK_SILENCE_MS = 1500;  // 1.5s pause triggers chunk send
    const MAX_SILENCE_MS = 8000;    // 8s total silence triggers AI

    function updateUIState(state) {
        character.className = `character-box state-${state}`;
        const charImage = document.getElementById('charImage');
        if (state === 'idle') {
            charImage.src = "/images/blob-idle.png";
            loading.textContent = "대기 중";
        } else if (state === 'listening') {
            charImage.src = "/images/blob-listening.gif";
            loading.textContent = "듣고 있어요...";
        } else if (state === 'analyzing') {
            charImage.src = "/images/blob-thinking.gif";
            loading.textContent = "생각 중...💭";
        } else if (state === 'speaking') {
            charImage.src = "/images/blob-speaking.gif";
            loading.textContent = "답변 중!";
        }
    }

    async function toggleRecording() {
        if (isAutoMode) {
            // Manual termination
            isAutoMode = false;
            isWaitingForAi = false;
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
            audioQueue.length = 0;
            updateUIState('idle');
            micBtn.textContent = '🎤';
            micBtn.classList.remove('recording');
        } else {
            // Start Tiki-Taka loop
            isAutoMode = true;
            micBtn.textContent = '⏹️';
            micBtn.classList.add('recording');

            if (!globalStream) {
                try {
                    globalStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    const source = audioContext.createMediaStreamSource(globalStream);
                    source.connect(analyser);
                    dataArray = new Float32Array(analyser.frequencyBinCount);
                    monitorVAD();
                } catch (e) {
                    alert("마이크 권한이 필요합니다.");
                    isAutoMode = false;
                    return;
                }
            }
            startContinuousListening();
        }
    }

    function monitorVAD() {
        requestAnimationFrame(monitorVAD);

        if (!isAutoMode || isPlaying || isWaitingForAi || !isRecording) return;

        analyser.getFloatTimeDomainData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i] * dataArray[i];
        let rms = Math.sqrt(sum / dataArray.length);

        if (rms > SPEECH_THRESHOLD) {
            hasSpokenInChunk = true;
            silenceStart = null;
            totalSilenceStart = Date.now(); // Reset full silence timer
            updateUIState('listening');
        } else {
            if (hasSpokenInChunk) {
                // User spoke, but paused
                if (!silenceStart) silenceStart = Date.now();
                else if (Date.now() - silenceStart > CHUNK_SILENCE_MS) {
                    // Stop current chunk to send, will auto-restart in onstop
                    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                }
            } else {
                // User has not spoken at all since mic turned on
                if (!totalSilenceStart) totalSilenceStart = Date.now();
                else if (Date.now() - totalSilenceStart > MAX_SILENCE_MS) {
                    triggerForceAiResponse();
                }
            }
        }
    }

    function startContinuousListening() {
        if (!isAutoMode || isPlaying || isWaitingForAi) return;

        audioChunks = [];
        hasSpokenInChunk = false;
        silenceStart = null;
        totalSilenceStart = Date.now();

        mediaRecorder = new MediaRecorder(globalStream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
            isRecording = false;
            const blob = new Blob(audioChunks, { type: 'audio/webm' });

            // Send chunk if user spoke
            if (hasSpokenInChunk && blob.size > 1000) {
                sendChunkToServer(blob);
            }

            // Immediately restart recording if we are not interrupted by AI
            if (isAutoMode && !isWaitingForAi && !isPlaying) {
                startContinuousListening();
            }
        };

        mediaRecorder.start();
        isRecording = true;
        updateUIState('listening'); // Keep listening state visually
    }

    async function sendChunkToServer(blob) {
        const formData = new FormData();
        formData.append('audio', blob, 'voice.webm');

        try {
            const response = await fetch(`/api/v1/learning/audio?sessionId=${sessionId}`, {
                method: 'POST', body: formData
            });
            if (response.ok) {
                const text = await response.text();
                if (text.trim() !== "") {
                    appendMessage("🎤 " + text, 'user-msg');
                }
            }
        } catch (error) {
            console.error("Chunk send failed", error);
        }
    }

    function triggerForceAiResponse() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop(); // This drops the empty chunk
        }

        isWaitingForAi = true;
        updateUIState('analyzing');
        appendMessage("...", 'user-msg');

        fetch(`/api/v1/learning/chat?sessionId=${sessionId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: "(System Notice: The user is silent. Ask a brief question to prompt them to explain the concept.)"
        }).catch(() => {
            isWaitingForAi = false;
            if (isAutoMode) startContinuousListening();
        });
    }

    // SSE Connection Initialization
    function initSseConnection() {
        if (eventSource) eventSource.close();
        eventSource = new EventSource(`/api/v1/learning/subscribe?sessionId=${sessionId}`);

        eventSource.addEventListener('message', (event) => {
            // Force stop any ongoing recording when AI starts replying
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                hasSpokenInChunk = false;
                mediaRecorder.stop();
            }

            isWaitingForAi = true;
            const data = JSON.parse(event.data);
            renderStreamingText(data.text);

            if (data.audio) {
                audioQueue.push("data:audio/mp3;base64," + data.audio);
                playNextInQueue();
            }
        });

        eventSource.addEventListener('done', () => {
            // Do not start mic here; wait for audio playback to finish completely
        });
    }
    initSseConnection();

    function renderStreamingText(text) {
        if (!currentAiMsgDiv) {
            currentAiMsgDiv = document.createElement('div');
            currentAiMsgDiv.className = 'message ai-msg';
            chatBox.appendChild(currentAiMsgDiv);
        }
        currentAiMsgDiv.textContent += text;
        chatBox.scrollTop = chatBox.scrollHeight;
        updateUIState('speaking');
    }

    function playNextInQueue() {
        if (isPlaying || audioQueue.length === 0) return;
        isPlaying = true;
        currentAudio = new Audio(audioQueue.shift());
        currentAudio.play();

        currentAudio.onended = () => {
            isPlaying = false;
            if (audioQueue.length > 0) {
                playNextInQueue();
            } else {
                // Audio queue is completely finished. Turn mic back on!
                isWaitingForAi = false;
                currentAudio = null;
                currentAiMsgDiv = null;

                if (isAutoMode) {
                    startContinuousListening();
                } else {
                    updateUIState('idle');
                }
            }
        };
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

    async function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;

        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
        audioQueue.length = 0;

        appendMessage(text, 'user-msg');
        inputField.value = '';
        isWaitingForAi = true;
        updateUIState('analyzing');

        try {
            await fetch(`/api/v1/learning/chat?sessionId=${sessionId}`, {
                method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: text
            });
        } catch (error) {
            isWaitingForAi = false;
            if (isAutoMode) startContinuousListening();
        }
    }

    async function endConversation() {
        const topic = prompt("오늘 복습한 핵심 키워드가 뭐야?", "자유 주제");
        if (!topic) return;
        document.getElementById('chat-section').style.display = 'none';
        document.getElementById('summary-section').style.display = 'flex';
        document.querySelector('.end-btn').style.display = 'none';

        isAutoMode = false;
        isWaitingForAi = false;
        if (globalStream) globalStream.getTracks().forEach(t => t.stop());

        try {
            await fetch(`/api/v1/learning/summary?sessionId=${sessionId}&topic=${encodeURIComponent(topic)}`, { method: 'POST' });
            document.getElementById('summaryContent').innerHTML = `<strong>"${topic}"</strong> 주제 요약이 저장되었습니다!`;
        } catch (error) {
            document.getElementById('summaryContent').innerHTML = "요약 저장에 실패했습니다.";
        }
    }
</script>
</body>
</html>

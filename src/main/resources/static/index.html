<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스터디 메이트 | 복습 지킴이</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --danger: #ef4444;
            --bg-gray: #f8fafc;
            --border: #e2e8f0;
            --user-bubble: #dbeafe;
            --ai-bubble: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #cbd5e1;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh; /* dynamic view height for mobile */
        }

        /* PC에서는 카드형, 모바일에서는 풀스크린 */
        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100dvh;
            background: var(--bg-gray);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        @media (min-width: 768px) {
            .app-container {
                height: 90vh;
                border-radius: 20px;
                overflow: hidden;
            }
        }

        /* 헤더 영역 */
        .header {
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title { font-weight: 700; font-size: 1.1rem; color: #1e293b; }

        /* 캐릭터 및 상태 표시부 */
        .status-bar {
            background: white;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .character-box {
            font-size: 2.5rem;
            margin-bottom: 5px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .state-speaking { transform: scale(1.2); }
        .state-listening { animation: bounce 1s infinite; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .loading-text { font-size: 0.85rem; color: #64748b; height: 1.2rem; }

        /* 채팅 영역 - 가득 채우기 */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .user-msg {
            background: var(--user-bubble);
            color: #1e40af;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: var(--ai-bubble);
            color: #334155;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        /* 하단 입력창 영역 */
        .input-container {
            background: white;
            padding: 15px 20px;
            border-top: 1px solid var(--border);
            padding-bottom: max(15px, env(safe-area-inset-bottom));
        }

        .input-area {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 24px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus { border-color: var(--primary); }

        .btn {
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-btn { background: var(--primary); color: white; border-radius: 12px; width: 60px; }
        .mic-btn { background: #f1f5f9; font-size: 1.2rem; }
        .mic-btn.recording {
            background: var(--danger);
            color: white;
            animation: pulse 1.5s infinite;
        }

        .end-btn {
            background: #fee2e2;
            color: var(--danger);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            width: 160px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* 요약 섹션 디자인 */
        #summary-section {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .summary-card {
            background: var(--bg-gray);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            margin: 20px 0;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span class="header-title">🧑‍💻 스터디 메이트</span>
        <button class="btn end-btn" onclick="endConversation()">대화 종료하고 요약하기</button>
    </div>

    <div class="status-bar">
        <div id="character" class="character-box">👨‍🎓</div>
        <div class="loading-text" id="loading">대화 준비 완료</div>
    </div>

    <div id="chat-section" style="display: contents;">
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">안녕, 서희! 오늘 배운 내용 나한테 한 번 설명해볼래? 😆</div>
        </div>

        <div class="input-container">
            <div class="input-area">
                <button class="btn mic-btn" id="micBtn" onclick="toggleRecording()">🎤</button>
                <input type="text" id="userInput" placeholder="메시지를 입력하세요..." onkeypress="handleEnter(event)">
                <button class="btn send-btn" onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

    <div id="summary-section" style="display: none;">
        <div style="font-size: 3rem;">📊</div>
        <h2>학습 요약 완료</h2>
        <div class="summary-card" id="summaryContent">요약을 생성하고 있습니다...</div>
        <div style="display: flex; gap: 12px; width: 100%;">
            <button class="btn" onclick="location.reload()" style="flex: 1; border-radius: 12px; background: #94a3b8; color: white;">다시 하기</button>
            <button class="btn" onclick="goToDashboard()" style="flex: 1; border-radius: 12px; background: #1e293b; color: white;">대시보드 보기</button>
        </div>
    </div>
</div>

<script>
    /* 세션 ID 관리 - localStorage 연동 */
    let sessionId = localStorage.getItem('msm_session_id');
    if (!sessionId) {
        sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('msm_session_id', sessionId);
    }

    const chatBox = document.getElementById('chatBox');
    const inputField = document.getElementById('userInput');
    const loading = document.getElementById('loading');
    const character = document.getElementById('character');
    const micBtn = document.getElementById('micBtn');

    let globalStream = null;
    let audioContext;
    let analyser;
    let silenceStart = null;
    let currentAudio = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let isAutoMode = false;
    const audioQueue = [];
    let isPlaying = false;
    let eventSource = null;
    let currentAiMsgDiv = null;

    const SILENCE_THRESHOLD = 0.05;
    const SPEECH_THRESHOLD = 0.08;
    const SILENCE_DURATION = 1500;

    function updateUIState(state) {
        character.className = `character-box state-${state}`;
        if (state === 'idle') { character.textContent = "👨‍🎓"; loading.textContent = "대기 중"; }
        if (state === 'listening') { character.textContent = "✍️"; loading.textContent = "듣고 있어요..."; }
        if (state === 'analyzing') { character.textContent = "🧠"; loading.textContent = "생각 중..."; }
        if (state === 'speaking') { character.textContent = "📢"; loading.textContent = "답변 중!"; }
    }

    function stopAiAudio() {
        if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; }
        audioQueue.length = 0;
        isPlaying = false;
        currentAiMsgDiv = null;
        if (eventSource) { eventSource.close(); eventSource = null; initSseConnection(); }
        updateUIState('idle');
    }

    async function toggleRecording() {
        stopAiAudio();
        if (isAutoMode && isRecording) {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            isRecording = false;
            return;
        }
        if (!isAutoMode) {
            isAutoMode = true;
            try {
                globalStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
                startAudioAnalysis(globalStream);
                startListeningChunk();
            } catch (err) { alert("마이크 권한이 필요합니다."); isAutoMode = false; }
        } else if (!isRecording) { startListeningChunk(); }
    }

    function startListeningChunk() {
        if (!globalStream || !isAutoMode) return;
        audioChunks = [];
        mediaRecorder = new MediaRecorder(globalStream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
            micBtn.textContent = '🎤';
            micBtn.classList.remove('recording');
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            if (audioBlob.size > 1000 && isAutoMode) sendAudioToServer(audioBlob);
            else if (isAutoMode) setTimeout(startListeningChunk, 300);
        };
        mediaRecorder.start();
        isRecording = true;
        micBtn.textContent = '⏹️';
        micBtn.classList.add('recording');
        updateUIState('listening');
    }

    async function sendAudioToServer(audioBlob) {
        const formData = new FormData();
        formData.append('audio', audioBlob, 'voice.webm');
        try {
            const response = await fetch(`/api/v1/learning/audio?sessionId=${sessionId}`, { method: 'POST', body: formData });
            if (response.ok) {
                const transcript = await response.text();
                if (transcript.trim() !== "") appendMessage("🎤 " + transcript, 'user-msg');
                else {
                    updateUIState('idle');
                    if (isAutoMode && !isRecording) setTimeout(startListeningChunk, 300);
                }
            }
        } catch (error) { updateUIState('idle'); }
    }

    function startAudioAnalysis(stream) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        const microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Float32Array(bufferLength);

        function checkAudioLevel() {
            if (!isAutoMode) return;
            analyser.getFloatTimeDomainData(dataArray);
            let sum = 0;
            for (let i = 0; i < bufferLength; i++) sum += dataArray[i] * dataArray[i];
            const rms = Math.sqrt(sum / bufferLength);

            if (rms > SPEECH_THRESHOLD && isPlaying) { stopAiAudio(); if (!isRecording) startListeningChunk(); }
            if (rms < SILENCE_THRESHOLD) {
                if (!silenceStart) silenceStart = Date.now();
                else if (Date.now() - silenceStart > SILENCE_DURATION && isRecording) {
                    mediaRecorder.stop(); isRecording = false; silenceStart = null;
                }
            } else { silenceStart = null; }
            requestAnimationFrame(checkAudioLevel);
        }
        checkAudioLevel();
    }

    function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

    async function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;
        stopAiAudio();
        appendMessage(text, 'user-msg');
        inputField.value = '';
        updateUIState('analyzing');
        try {
            await fetch(`/api/v1/learning/chat?sessionId=${sessionId}`, {
                method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: text
            });
        } catch (error) { updateUIState('idle'); }
    }

    function initSseConnection() {
        if (eventSource) eventSource.close();
        eventSource = new EventSource(`/api/v1/learning/subscribe?sessionId=${sessionId}`);
        eventSource.addEventListener('message', (event) => {
            const data = JSON.parse(event.data);
            renderStreamingText(data.text);
            if (data.audio) { audioQueue.push("data:audio/mp3;base64," + data.audio); playNextInQueue(); }
        });
    }
    initSseConnection();

    function renderStreamingText(text) {
        if (!currentAiMsgDiv) {
            currentAiMsgDiv = document.createElement('div');
            currentAiMsgDiv.className = 'message ai-msg';
            chatBox.appendChild(currentAiMsgDiv);
        }
        currentAiMsgDiv.textContent += text;
        chatBox.scrollTop = chatBox.scrollHeight;
        updateUIState('speaking');
    }

    function playNextInQueue() {
        if (isPlaying || audioQueue.length === 0) return;
        isPlaying = true;
        currentAudio = new Audio(audioQueue.shift());
        currentAudio.play();
        currentAudio.onended = () => {
            isPlaying = false;
            if (audioQueue.length > 0) playNextInQueue();
            else {
                updateUIState('idle'); currentAudio = null; currentAiMsgDiv = null;
                setTimeout(() => { if (!isRecording && isAutoMode) startListeningChunk(); }, 300);
            }
        };
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function endConversation() {
        const topic = prompt("오늘 복습한 핵심 키워드가 뭐야?", "자유 주제");
        if (!topic) return;
        document.getElementById('chat-section').style.display = 'none';
        document.getElementById('summary-section').style.display = 'flex';
        document.querySelector('.end-btn').style.display = 'none';
        isAutoMode = false;
        if (globalStream) globalStream.getTracks().forEach(t => t.stop());
        try {
            const response = await fetch(`/api/v1/learning/summary?sessionId=${sessionId}&topic=${encodeURIComponent(topic)}`, { method: 'POST' });
            const summary = await response.text();
            document.getElementById('summaryContent').innerHTML = `<strong>"${topic}"</strong> 주제 요약이 저장되었습니다!`;
        } catch (error) { document.getElementById('summaryContent').innerHTML = "요약 저장에 실패했습니다."; }
    }

    function goToDashboard() { window.location.href = `/dashboard.html`; }
</script>
</body>
</html>

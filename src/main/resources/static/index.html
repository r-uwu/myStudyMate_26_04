<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나의 스터디 메이트 | 복습 지킴이</title>
    <style>
        :root {
            --primary: rgb(161 179 198);
            --primary-send: rgb(110 142 181);
            --primary-hover: rgb(75, 75, 75); /* 호버 시 약간 밝게 */
            --primary-dark: #2563eb;
            --danger: #856341;
            --danger-hover: #6d5135;
            --accent: #f6de90;
            --accent-hover: #f1d371;
            --bg-gray:#f1f5f9;
            --bg-temp:#f8fafc;
            --border: #e2e8f0;
            --user-bubble: #dbeafe;
            --ai-bubble: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
        }


        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
        }

        /* 컨테이너 그림자 및 모서리 디테일 */
        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100dvh;
            background: var(--bg-gray);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        @media (min-width: 768px) {
            .app-container {
                height: 90vh;
                border-radius: 24px;
                overflow: hidden;
                border: 1px solid rgba(255,255,255,0.3);
            }
        }

        /* 헤더 */
        .header {
            padding: 18px 20px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title { font-weight: 800; font-size: 1.1rem; color: var(--primary); letter-spacing: -0.02em; }

        /* 상태바 및 캐릭터 */
        .status-bar {
            background: white;
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .character-box {
            font-size: 2.8rem;
            margin-bottom: 4px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
        }

        .state-speaking { transform: scale(1.15) rotate(5deg); }
        .state-listening { animation: bounce 1.2s infinite ease-in-out; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .loading-text { font-size: 0.8rem; color: #94a3b8; font-weight: 500; height: 1.2rem; }

        /* 채팅 박스 스크롤바 커스텀 */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* 메시지 말풍선 세련되게 */
        .message {
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
            box-shadow: var(--shadow-sm);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: var(--ai-bubble);
            color: #334155;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        /* 하단 입력바 및 버튼 효과 */
        .input-container {
            background: white;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }

        .input-area { display: flex; gap: 10px; align-items: center; }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border: 1.5px solid var(--border);
            border-radius: 26px;
            outline: none;
            font-size: 1rem;
            transition: all 0.2s;
            background: #f1f5f9;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(51, 51, 51, 0.1);
        }

        /* 공통 버튼 효과 (Hover & Active) */
        .btn {
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            height: 44px;
        }

        /* 버튼 호버 효과 추가 */
        .btn:hover {
            filter: brightness(1.2) drop-shadow(0 0 8px rgba(110, 142, 181, 0.4));
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
            filter: brightness(0.9);
        }

        .send-btn {
            background: var(--primary-send);
            color: white;
            border-radius: 14px;
            width: 60px;
            height: 44px;
            font-weight: 600;
        }

        .mic-btn {
            background: #f1f5f9;
            font-size: 1.3rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
        }

        .mic-btn.recording {
            background: var(--danger);
            color: white;
            animation: pulse 1.5s infinite;
        }

        .end-btn {
            background: var(--accent);
            color: var(--danger);
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            width: auto;
            min-width: 80px;
            box-shadow: 0 2px 4px rgba(133, 99, 65, 0.1);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(133, 99, 65, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(133, 99, 65, 0); }
            100% { box-shadow: 0 0 0 0 rgba(133, 99, 65, 0); }
        }

        /* 요약 섹션 디자인 */
        #summary-section {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .summary-card {
            background: #f8fafc;
            padding: 28px;
            border-radius: 20px;
            width: 100%;
            margin: 24px 0;
            line-height: 1.8;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            color: #334155;
        }




         :root {
             /* 라이트 모드: 서희님의 스카이 블루/그레이 테마 */
             --primary: rgb(161, 179, 198);
             --primary-send: rgb(110, 142, 181);
             --bg-body: #f1f5f9;
             --bg-app: #ffffff;
             --text-main: #1e293b;
             --border: #e2e8f0;
             --ai-bubble: #f8fafc;
             --user-bubble: var(--primary-send);
             --user-text: #ffffff;
             --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
         }

        @media (prefers-color-scheme: dark) {
            :root {
                /* 다크 모드: 쿨 그레이 & 프로스트 블루 테마 */
                --bg-body: #121212;         /* 딥 차콜 */
                --bg-app: #1e1e1e;          /* 다크 그레이 */
                --bg-header: #1e1e1e;
                --text-main: #e2e8f0;       /* 연한 회색 글자 */
                --border: #333333;

                /* 하늘색 포인트 컬러는 다크모드에서 채도를 살짝 올림 */
                --primary: rgb(171, 191, 212);
                --primary-send: rgb(125, 160, 205);

                --ai-bubble: #2d2d2d;       /* AI 말풍선: 짙은 회색 */
                --user-bubble: rgba(110, 142, 181, 0.9); /* 사용자: 반투명 블루 */
                --user-text: #ffffff;
            }

            .app-container {
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            }

            .header, .status-bar, .input-container {
                background: var(--bg-app) !important;
                border-color: var(--border);
            }

            input[type="text"] {
                background: #2d2d2d !important;
                color: white;
                border-color: #444444;
            }

            .ai-msg {
                color: #cbd5e1;
                border: 1px solid #3d3d3d;
            }

            /* 다크모드 버튼 호버 효과 */
            .btn:hover {
                filter: brightness(1.2);
                box-shadow: 0 0 15px rgba(110, 142, 181, 0.3);
            }

            .character-box, #charImage {
                filter: none !important; /* 브라우저의 강제 색상 반전 무시 */
                -webkit-filter: none !important;
            }

            color-scheme: light; /* 해당 요소만 라이트 모드 기준으로 렌더링하도록 유도 */

        }

        #charImage {
            color-scheme: light; /* 해당 요소만 라이트 모드 기준으로 렌더링하도록 유도 */
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span class="header-title">나의 스터디 메이트</span>
        <button class="btn end-btn" onclick="endConversation()">대화 종료하고 요약하기</button>
    </div>

    <div class="status-bar">
        <div id="character" class="character-box">
            <img id="charImage" src="/images/idle.gif" style="width: 80px; height: 80px; object-fit: contain;">
        </div>
        <div class="loading-text" id="loading">대화 준비 완료</div>
    </div>

    <div id="chat-section" style="display: contents;">
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">안녕! 오늘 공부할 내용을 나한테도 들려줄래? 😆<br>
            <div style="color:gray;">좌측 하단 마이크 버튼을 눌러 음성 인식을 시작할 수 있으며, 모바일로도 가능합니다.</div></div>
        </div>

        <div class="input-container">
            <div class="input-area">
                <button class="btn mic-btn" id="micBtn" onclick="toggleRecording()">🎤</button>
                <input type="text" id="userInput" placeholder="메시지를 입력하세요..." onkeypress="handleEnter(event)">
                <button class="btn send-btn" onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

    <div id="summary-section" style="display: none;">
        <div style="font-size: 3rem;">📊</div>
        <h2>학습 요약 완료</h2>
        <div class="summary-card" id="summaryContent">요약을 생성하고 있습니다...</div>
        <div style="display: flex; gap: 12px; width: 100%;">
            <button class="btn" onclick="location.reload()" style="flex: 1; border-radius: 12px; background: #94a3b8; color: white;">다시 하기</button>
            <button class="btn" onclick="goToDashboard()" style="flex: 1; border-radius: 12px; background: #6d8db4; color: white;">대시보드 보기</button>
        </div>
    </div>
</div>

<script>
    /* 세션 ID 관리 - localStorage 연동 */
    let sessionId = localStorage.getItem('msm_session_id');
    if (!sessionId) {
        sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('msm_session_id', sessionId);
    }

    const chatBox = document.getElementById('chatBox');
    const inputField = document.getElementById('userInput');
    const loading = document.getElementById('loading');
    const character = document.getElementById('character');
    const micBtn = document.getElementById('micBtn');

    let globalStream = null;
    let audioContext;
    let analyser;
    let silenceStart = null;
    let currentAudio = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let isAutoMode = false;
    const audioQueue = [];
    let isPlaying = false;
    let eventSource = null;
    let currentAiMsgDiv = null;

    const SILENCE_THRESHOLD = 0.05;
    const SPEECH_THRESHOLD = 0.08;
    const SILENCE_DURATION = 2000;

    function updateUIState(state) {
        character.className = `character-box state-${state}`;
        // if (state === 'idle') { character.textContent = "👨‍🎓"; loading.textContent = "대기 중"; }
        // if (state === 'listening') { character.textContent = "✍️"; loading.textContent = "듣고 있어요..."; }
        // if (state === 'analyzing') { character.textContent = "🧠"; loading.textContent = "생각 중..."; }
        // if (state === 'speaking') { character.textContent = "📢"; loading.textContent = "답변 중!"; }

        const charImage = document.getElementById('charImage');
        if (state === 'idle') {
            charImage.src = "/images/blob-idle.png";
            loading.textContent = "대기 중";
        }
        if (state === 'listening') {
            charImage.src = "/images/blob-listening.gif";
            loading.textContent = "듣고 있어요...";
        }
        if (state === 'analyzing') {
            charImage.src = "/images/blob-thinking.gif";
            loading.textContent = "생각 중...💭";
        }
        if (state === 'speaking') {
            charImage.src = "/images/blob-speaking.gif"; // 말할 때는 움짤(GIF)도 가능!
            loading.textContent = "답변 중!";
        }
    }

    function stopAiAudio() {
        if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; }
        audioQueue.length = 0;
        isPlaying = false;
        currentAiMsgDiv = null;
        if (eventSource) { eventSource.close(); eventSource = null; initSseConnection(); }
        updateUIState('idle');
    }

    async function toggleRecording() {
        stopAiAudio();
        if (isAutoMode && isRecording) {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            isRecording = false;
            return;
        }
        if (!isAutoMode) {
            isAutoMode = true;
            try {
                globalStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
                startAudioAnalysis(globalStream);
                startListeningChunk();
            } catch (err) { alert("마이크 권한이 필요합니다."); isAutoMode = false; }
        } else if (!isRecording) { startListeningChunk(); }
    }

    function startListeningChunk() {
        if (!globalStream || !isAutoMode) return;
        audioChunks = [];
        mediaRecorder = new MediaRecorder(globalStream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
            micBtn.textContent = '🎤';
            micBtn.classList.remove('recording');
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            if (audioBlob.size > 3000 && isAutoMode) sendAudioToServer(audioBlob);
            else if (isAutoMode) setTimeout(startListeningChunk, 300);
        };
        mediaRecorder.start();
        isRecording = true;
        micBtn.textContent = '⏹️';
        micBtn.classList.add('recording');
        updateUIState('listening');
    }

    async function sendAudioToServer(audioBlob) {
        const formData = new FormData();
        formData.append('audio', audioBlob, 'voice.webm');

        try {
            const response = await fetch(`/api/v1/learning/audio?sessionId=${sessionId}`, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const transcript = await response.text();
                if (transcript.trim() !== "") {
                    appendMessage("🎤 " + transcript, 'user-msg');
                    // 💡 여기서 AI의 SSE 응답을 기다리게 됩니다.
                } else {
                    // 💡 들려온 소리가 없거나 너무 작아서 무시된 경우 -> 즉시 다시 듣기
                    forceResumeMic();
                }
            } else {
                forceResumeMic();
            }
        } catch (error) {
            console.error("음성 전송 실패", error);
            resumeListening();
        }
    }

    // 💡 공통으로 사용할 리스닝 재개 함수
    function resumeListening() {
        updateUIState('idle');
        if (isAutoMode && !isRecording && !isPlaying) {
            setTimeout(startListeningChunk, 300);
        }
    }

    function startAudioAnalysis(stream) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        const microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Float32Array(bufferLength);

        function checkAudioLevel() {
            if (!isAutoMode) return;
            analyser.getFloatTimeDomainData(dataArray);
            let sum = 0;
            for (let i = 0; i < bufferLength; i++) sum += dataArray[i] * dataArray[i];
            const rms = Math.sqrt(sum / bufferLength);

            if (rms > SPEECH_THRESHOLD && isPlaying) { stopAiAudio(); if (!isRecording) startListeningChunk(); }
            if (rms < SILENCE_THRESHOLD) {
                if (!silenceStart) silenceStart = Date.now();
                else if (Date.now() - silenceStart > SILENCE_DURATION && isRecording) {
                    mediaRecorder.stop(); isRecording = false; silenceStart = null;
                }
            } else { silenceStart = null; }
            requestAnimationFrame(checkAudioLevel);
        }
        checkAudioLevel();
    }

    function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

    async function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;
        stopAiAudio();
        appendMessage(text, 'user-msg');
        inputField.value = '';
        updateUIState('analyzing');
        try {
            await fetch(`/api/v1/learning/chat?sessionId=${sessionId}`, {
                method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: text
            });
        } catch (error) { updateUIState('idle'); }
    }

    function initSseConnection() {
        if (eventSource) eventSource.close();
        eventSource = new EventSource(`/api/v1/learning/subscribe?sessionId=${sessionId}`);

        eventSource.addEventListener('message', (event) => {
            const data = JSON.parse(event.data);
            renderStreamingText(data.text);
            if (data.audio) { audioQueue.push("data:audio/mp3;base64," + data.audio); playNextInQueue(); }
        });

        eventSource.addEventListener('done', () => {
            console.log("AI 응답 생성 완료");
            // 만약 재생할 오디오가 아예 없었다면(텍스트만 왔다면), 여기서 바로 마이크를 켭니다.
            setTimeout(() => {
                if (isAutoMode && !isRecording && !isPlaying) {
                    startListeningChunk();
                }
            }, 500);
        });

        eventSource.addEventListener('done', () => {
            console.log("AI 답변 프로세스 종료");
            // 오디오 재생 중이 아니라면 바로 마이크를 켭니다.
            if (!isPlaying) {
                forceResumeMic();
            }
        });
    }
    initSseConnection();


    // 💡 마이크를 안전하게 다시 켜는 통합 함수
    function forceResumeMic() {
        updateUIState('idle');
        if (isAutoMode && !isRecording && !isPlaying) {
            setTimeout(() => {
                if (!isRecording) startListeningChunk();
            }, 500);
        }
    }

    // 💡 샌드 메시지나 음성 전송 시 'analyzing' 상태가 너무 길어지면 강제 복구
    function startSafetyTimeout() {
        setTimeout(() => {
            if (loading.textContent.includes("생각 중") || loading.textContent.includes("정리 중")) {
                console.warn("응답 지연으로 인한 마이크 강제 복구");
                forceResumeMic();
            }
        }, 8000); // 8초 이상 응답 없으면 강제 복구
    }


    function renderStreamingText(text) {
        if (!currentAiMsgDiv) {
            currentAiMsgDiv = document.createElement('div');
            currentAiMsgDiv.className = 'message ai-msg';
            chatBox.appendChild(currentAiMsgDiv);
        }
        currentAiMsgDiv.textContent += text;
        chatBox.scrollTop = chatBox.scrollHeight;
        updateUIState('speaking');
    }

    function playNextInQueue() {
        if (isPlaying || audioQueue.length === 0) return;
        isPlaying = true;
        currentAudio = new Audio(audioQueue.shift());
        currentAudio.play();
        currentAudio.onended = () => {
            isPlaying = false;
            if (audioQueue.length > 0) playNextInQueue();
            else {
                updateUIState('idle'); currentAudio = null; currentAiMsgDiv = null;
                setTimeout(() => { if (!isRecording && isAutoMode) startListeningChunk(); }, 300);
            }
        };
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function endConversation() {
        const topic = prompt("오늘 복습한 핵심 키워드가 뭐야?", "자유 주제");
        if (!topic) return;
        document.getElementById('chat-section').style.display = 'none';
        document.getElementById('summary-section').style.display = 'flex';
        document.querySelector('.end-btn').style.display = 'none';
        isAutoMode = false;
        if (globalStream) globalStream.getTracks().forEach(t => t.stop());
        try {
            const response = await fetch(`/api/v1/learning/summary?sessionId=${sessionId}&topic=${encodeURIComponent(topic)}`, { method: 'POST' });
            const summary = await response.text();
            document.getElementById('summaryContent').innerHTML = `<strong>"${topic}"</strong> 주제 요약이 저장되었습니다!`;
        } catch (error) { document.getElementById('summaryContent').innerHTML = "요약 저장에 실패했습니다."; }

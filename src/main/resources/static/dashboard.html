<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통계 대시보드 | 나의 스터디 메이트</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        if (!localStorage.getItem('jwt_token')) window.location.href = '/login.html';
    </script>
    <style>
        /* Global Design Variables */
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #3b82f6;
            --primary-light: #eff6ff;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; min-height: 100dvh;
        }

        .dashboard-container {
            width: 100%; max-width: 1200px;
            margin: 0 auto; padding: 32px 24px;
            flex: 1;
        }

        /* Dashboard Grid Layout */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 24px;
        }

        .chart-card {
            background-color: var(--bg-card);
            border-radius: 16px; padding: 24px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border);
            display: flex; flex-direction: column;
        }

        .chart-card h3 {
            margin: 0 0 16px 0; font-size: 1.1rem;
            color: var(--text-main); font-weight: 700;
        }

        .chart-container {
            position: relative; flex-grow: 1; min-height: 280px; width: 100%;
        }

        .col-span-8 { grid-column: span 8; }
        .col-span-4 { grid-column: span 4; }
        .col-span-12 { grid-column: span 12; }

        @media (max-width: 992px) {
            .col-span-8, .col-span-4 { grid-column: span 12; }
        }

        /* Summary Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px; margin-bottom: 24px;
        }

        .stat-card {
            background-color: var(--bg-card); border-radius: 16px; padding: 24px;
            border: 1px solid var(--border); border-left: 4px solid var(--primary);
            box-shadow: var(--shadow-sm); transition: transform 0.2s;
        }

        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stat-title { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        .stat-value { font-size: 2rem; font-weight: 800; color: var(--text-main); }

    </style>
</head>
<body>

<script src="/js/header.js"></script>

<div class="dashboard-container">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">총 학습 시간 (이번 주)</div>
            <div class="stat-value" id="totalHours">측정 불가</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">완료한 세션</div>
            <div class="stat-value" id="completedSessions">0건</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">연속 학습일</div>
            <div class="stat-value" id="streakDays">- 일</div>
        </div>
    </div>

    <div class="chart-grid">
        <div class="chart-card col-span-8">
            <h3>주간 학습 시간 추이</h3>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <div class="chart-card col-span-4">
            <h3>주제별 학습 비중</h3>
            <div class="chart-container">
                <canvas id="subjectChart"></canvas>
            </div>
        </div>

        <div class="chart-card col-span-12">
            <h3>월간 학습 활동량</h3>
            <div class="chart-container" style="min-height: 320px;">
                <canvas id="activityChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('jwt_token');

    const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-main').trim();
    const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
    const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();

    Chart.defaults.color = textColor;
    Chart.defaults.font.family = "'Pretendard', sans-serif";

    let trendChartInstance = null;
    let subjectChartInstance = null;
    let activityChartInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
        /* Fix: Execute load without undefined sessionId parameter */
        loadDashboardData();
    });

    async function loadDashboardData() {
        try {
            const [subjectRes, weeklyRes] = await Promise.all([
                fetch(`/api/v1/learning/stats/subjects`, {
                    method: 'GET',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
                }),
                fetch(`/api/v1/learning/stats/weekly`, {
                    method: 'GET',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
                })
            ]);

            if (subjectRes.ok && weeklyRes.ok) {
                const subjectData = await subjectRes.json();
                const weeklyData = await weeklyRes.json();

                renderKPIs(weeklyData);
                renderSubjectChart(subjectData);
                renderActivityChart(weeklyData);
                renderTrendChartPlaceholder();
            } else {
                console.error("API response error");
            }
        } catch (error) {
            console.error("Failed to load dashboard data.", error);
        }
    }

    function renderKPIs(weeklyData) {
        let totalSessions = 0;
        weeklyData.forEach(week => {
            totalSessions += (week.summaryCount || 0);
        });
        document.getElementById('completedSessions').textContent = totalSessions + '건';
    }

    function renderSubjectChart(subjectData) {
        const labels = subjectData.map(d => d.subjectName || '기타');
        const dataPoints = subjectData.map(d => d.studyCount || 0);

        const ctxSubject = document.getElementById('subjectChart').getContext('2d');
        if (subjectChartInstance) subjectChartInstance.destroy();

        subjectChartInstance = new Chart(ctxSubject, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: dataPoints,
                    backgroundColor: [
                        '#3b82f6', '#60a5fa', '#93c5fd', '#bfdbfe', '#e0e7ff'
                    ],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false, cutout: '70%',
                plugins: { legend: { position: 'bottom', labels: { padding: 20 } } }
            }
        });
    }

    function renderActivityChart(weeklyData) {
        const labels = weeklyData.map(d => d.weekLabel || '미상');
        const dataPoints = weeklyData.map(d => d.summaryCount || 0);

        const ctxActivity = document.getElementById('activityChart').getContext('2d');
        if (activityChartInstance) activityChartInstance.destroy();

        activityChartInstance = new Chart(ctxActivity, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: '생성된 요약본 수',
                    data: dataPoints,
                    backgroundColor: primaryColor,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: gridColor }, ticks: { stepSize: 1 } },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    function renderTrendChartPlaceholder() {
        const ctxTrend = document.getElementById('trendChart').getContext('2d');
        if (trendChartInstance) trendChartInstance.destroy();

        trendChartInstance = new Chart(ctxTrend, {
            type: 'line',
            data: {
                labels: ['월', '화', '수', '목', '금', '토', '일'],
                datasets: [{
                    label: '학습 시간 (시간)',
                    data: [0, 0, 0, 0, 0, 0, 0],
                    borderColor: '#94a3b8',
                    backgroundColor: 'rgba(148, 163, 184, 0.1)',
                    borderWidth: 2, fill: true, tension: 0.4
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: gridColor }, max: 5 },
                    x: { grid: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
</script>
</body>
</html>

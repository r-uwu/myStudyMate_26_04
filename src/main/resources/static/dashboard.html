<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystudymate 통계 대시보드</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: rgb(110, 142, 181);
            --primary-light: rgba(110, 142, 181, 0.2);
            --secondary-color: rgb(161, 179, 198);
            --accent-color: rgb(94, 234, 212);
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border-color: #334155;
                --primary-light: rgba(125, 160, 205, 0.2);
                --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            }
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            line-height: 1.6;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            padding: 3rem 1.5rem;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .nav-links a {
            padding: 0.6rem 1.25rem;
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-left: 0.5rem;
        }

        .nav-links a:hover {
            background-color: var(--bg-color);
            border-color: var(--text-muted);
        }

        .nav-links a.active {
            background-color: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        /* Dashboard Grid Layout */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
        }

        .chart-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .chart-card h3 {
            margin: 0 0 1rem 0;
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .chart-container {
            position: relative;
            flex-grow: 1;
            min-height: 250px;
            width: 100%;
        }

        /* Span configurations for different charts */
        .col-span-8 { grid-column: span 8; }
        .col-span-4 { grid-column: span 4; }
        .col-span-6 { grid-column: span 6; }
        .col-span-12 { grid-column: span 12; }

        @media (max-width: 992px) {
            .col-span-8, .col-span-4, .col-span-6 {
                grid-column: span 12;
            }
        }

        /* Summary Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            box-shadow: var(--shadow-sm);
        }

        .stat-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header>
        <h1>학습 통계 대시보드</h1>
        <div class="nav-links">
            <a href="/summary.html">학습 요약표</a>
            <a href="/dashboard.html" class="active">통계 대시보드</a>
        </div>
    </header>

    <!-- KPI Summary Section -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">총 학습 시간 (이번 주)</div>
            <div class="stat-value" id="totalHours">14.5h</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">완료한 세션</div>
            <div class="stat-value" id="completedSessions">24건</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">연속 학습일</div>
            <div class="stat-value" id="streakDays">5일</div>
        </div>
    </div>

    <!-- Charts Section -->
    <div class="chart-grid">
        <!-- Weekly Study Trend (Area Chart) -->
        <div class="chart-card col-span-8">
            <h3>주간 학습 시간 추이</h3>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <!-- Subject Distribution (Doughnut Chart) -->
        <div class="chart-card col-span-4">
            <h3>주제별 학습 비중</h3>
            <div class="chart-container">
                <canvas id="subjectChart"></canvas>
            </div>
        </div>

        <!-- Monthly Activity (Bar Chart) -->
        <div class="chart-card col-span-12">
            <h3>월간 학습 활동량</h3>
            <div class="chart-container" style="min-height: 300px;">
                <canvas id="activityChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // Set common chart options for responsive design and dark mode adaptation
    const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-main').trim();
    const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim();

    Chart.defaults.color = textColor;
    Chart.defaults.font.family = "'Pretendard', sans-serif";

    // 1. Weekly Trend Chart (Area Line Chart)
    const ctxTrend = document.getElementById('trendChart').getContext('2d');
    new Chart(ctxTrend, {
        type: 'line',
        data: {
            labels: ['월', '화', '수', '목', '금', '토', '일'],
            datasets: [{
                label: '학습 시간 (시간)',
                data: [1.5, 2.0, 1.0, 3.5, 2.0, 4.0, 0.5],
                borderColor: 'rgb(110, 142, 181)',
                backgroundColor: 'rgba(110, 142, 181, 0.2)',
                borderWidth: 2,
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: gridColor }
                },
                x: {
                    grid: { display: false }
                }
            },
            plugins: {
                legend: { display: false }
            }
        }
    });

    // 2. Subject Distribution Chart (Doughnut Chart)
    const ctxSubject = document.getElementById('subjectChart').getContext('2d');
    new Chart(ctxSubject, {
        type: 'doughnut',
        data: {
            labels: ['Spring Boot', 'JavaScript', 'Database', 'CS Foundation'],
            datasets: [{
                data: [45, 25, 20, 10],
                backgroundColor: [
                    'rgb(110, 142, 181)',
                    'rgb(161, 179, 198)',
                    'rgb(94, 234, 212)',
                    'rgb(203, 213, 225)'
                ],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '70%',
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { padding: 20 }
                }
            }
        }
    });

    // 3. Monthly Activity Chart (Bar Chart)
    const ctxActivity = document.getElementById('activityChart').getContext('2d');
    new Chart(ctxActivity, {
        type: 'bar',
        data: {
            labels: ['1주차', '2주차', '3주차', '4주차'],
            datasets: [{
                label: '생성된 요약본 수',
                data: [12, 19, 15, 22],
                backgroundColor: 'rgb(110, 142, 181)',
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: gridColor }
                },
                x: {
                    grid: { display: false }
                }
            }
        }
    });
</script>
</body>
</html>

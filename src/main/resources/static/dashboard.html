<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title style="white-space: nowrap">학습 대시보드 📚</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-muted: #888888;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #E4E7EB;
            padding-bottom: 1rem;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--text-main);
        }

        .back-btn {
            padding: 0.5rem 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .back-btn:hover {
            background-color: #357ABD;
        }

        /* 상태 메시지 (로딩, 에러, 빈 값) */
        #statusMessage {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* 카드 그리드 레이아웃 */
        .log-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* 개별 학습 로그 카드 */
        .log-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .log-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .log-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .log-topic {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0 0 1rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #E4E7EB;
        }

        .log-summary {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
            white-space: pre-line; /* \n 줄바꿈을 화면에 적용 */
            flex-grow: 1;
        }

    </style>
</head>
<body>

<div class="dashboard-container">
    <header>
        <h1 style="white-space: nowrap">학습 대시보드 📚</h1>
        <a href="/index.html" class="back-btn">새 대화 시작하기</a>
    </header>

    <div id="statusMessage">학습 기록을 불러오는 중입니다... ⏳</div>

    <div id="logGrid" class="log-grid" style="display: none;"></div>
</div>

<script>
    // 1. URL에서 sessionId 가져오기 (예: dashboard.html?sessionId=session_123)
    const urlParams = new URLSearchParams(window.location.search);
    const currentSessionId = localStorage.getItem('msm_session_id');
    const statusMessage = document.getElementById('statusMessage');
    const logGrid = document.getElementById('logGrid');

    async function loadLearningLogs() {
        if (!currentSessionId) {
            statusMessage.innerHTML = "❌ 세션 정보가 없습니다. 대화를 먼저 진행해 주세요.";
            return;
        }

        try {
            // 2. 서버 API 호출
            const response = await fetch(`/api/v1/learning/history?sessionId=${currentSessionId}`);
            if (!response.ok) throw new Error("서버 응답 오류");

            const logs = await response.json();

            // 3. 데이터 유무 확인
            if (!logs || logs.length === 0) {
                statusMessage.innerHTML = `📝 세션(${currentSessionId})에 저장된 기록이 없습니다.<br>AI와 대화를 나누고 요약을 저장해 보세요!`;
                return;
            }

            statusMessage.style.display = 'none';
            logGrid.style.display = 'grid';
            logGrid.innerHTML = ''; // 기존 내용 초기화

            // 4. 카드 생성
            logs.forEach(log => {
                const card = document.createElement('div');
                card.className = 'log-card';

                // 날짜 포맷팅
                const createdAtRaw = log.createdAt; // 서버에서 온 데이터
                if (createdAtRaw) {
                    // 서버에서 온 데이터가 배열 형태([2026, 4, 13, ...])일 경우와 문자열일 경우 모두 대응
                    const dateObj = Array.isArray(createdAtRaw)
                        ? new Date(createdAtRaw[0], createdAtRaw[1]-1, createdAtRaw[2], createdAtRaw[3], createdAtRaw[4])
                        : new Date(createdAtRaw);

                    if (!isNaN(dateObj)) {
                        formattedDate = dateObj.toLocaleString('ko-KR', {
                            year: 'numeric', month: 'long', day: 'numeric',
                            hour: '2-digit', minute: '2-digit'
                        });
                    }
                }

                // 💡 핵심: DB 필드명(topic, summary)과 정확히 일치시켜야 함
                const topicText = log.topic || "자유 주제";
                const summaryText = log.summary || "요약 내용이 없습니다.";

                card.innerHTML = `
                    <div class="log-date">🕒 ${formattedDate}</div>
                    <h3 class="log-topic">📌 ${topicText}</h3>
                    <div class="log-summary">${summaryText}</div>
                `;
                logGrid.appendChild(card);
            });

        } catch (error) {
            console.error("로그 로딩 실패:", error);
            statusMessage.innerHTML = "⚠️ 데이터를 가져오지 못했습니다. 서버 연결을 확인하세요.";
        }
    }

    window.addEventListener('DOMContentLoaded', loadLearningLogs);
</script>
</body>
</html>

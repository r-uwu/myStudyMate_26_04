<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 나의 스터디 메이트</title>
    <style>
        :root {
            --primary-send: rgb(110, 142, 181);
            --bg-gray: #f1f5f9;
            --border: #e2e8f0;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }

        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%; max-width: 400px;
            text-align: center;
        }

        h1 { color: var(--primary-send); font-weight: 800; margin-bottom: 10px; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #475569; }
        .form-group input {
            width: 100%; padding: 12px; border: 1px solid var(--border);
            border-radius: 8px; outline: none; font-size: 1rem; box-sizing: border-box;
        }
        .form-group input:focus { border-color: var(--primary-send); }

        .auth-btn {
            width: 100%; padding: 14px; background: var(--primary-send);
            color: white; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s;
            margin-bottom: 15px;
        }
        .auth-btn:hover { background: #50739e; }

        .toggle-mode { color: #64748b; font-size: 0.9rem; cursor: pointer; text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="auth-container">
    <h1 id="authTitle">로그인</h1>
    <p id="authSubtitle">스터디 메이트에 오신 것을 환영합니다!</p>

    <div id="loginForm">
        <div class="form-group">
            <label>이메일</label>
            <input type="email" id="loginEmail" placeholder="example@email.com">
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" id="loginPassword" placeholder="비밀번호 입력">
        </div>
        <button class="auth-btn" onclick="handleLogin()">로그인</button>
        <span class="toggle-mode" onclick="toggleAuthMode('signup')">계정이 없으신가요? 회원가입</span>
    </div>

    <div id="signupForm" class="hidden">
        <div class="form-group">
            <label>이메일</label>
            <input type="email" id="signupEmail" placeholder="example@email.com">
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" id="signupPassword" placeholder="비밀번호 입력">
        </div>
        <div class="form-group">
            <label>이름 (닉네임)</label>
            <input type="text" id="signupName" placeholder="사용할 이름 입력">
        </div>
        <button class="auth-btn" onclick="handleSignup()">회원가입</button>
        <span class="toggle-mode" onclick="toggleAuthMode('login')">이미 계정이 있으신가요? 로그인</span>
    </div>
</div>

<script>
    function toggleAuthMode(mode) {
        if (mode === 'signup') {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('authTitle').innerText = '회원가입';
            document.getElementById('authSubtitle').innerText = '새로운 계정을 만들어보세요.';
        } else {
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('authTitle').innerText = '로그인';
            document.getElementById('authSubtitle').innerText = '스터디 메이트에 오신 것을 환영합니다!';
        }
    }

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) return alert('이메일과 비밀번호를 입력해주세요.');

        try {
            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                const data = await response.json();
                // 발급받은 JWT를 브라우저 로컬 스토리지에 저장
                localStorage.setItem('jwt_token', data.token);
                // 기존 가짜 세션 ID 삭제
                localStorage.removeItem('msm_session_id');
                window.location.href = '/index.html'; // 채팅/대시보드 메인으로 이동
            } else {
                alert('로그인 실패: 이메일 또는 비밀번호를 확인해주세요.');
            }
        } catch (error) {
            console.error(error);
            alert('서버 오류가 발생했습니다.');
        }
    }

    async function handleSignup() {
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const name = document.getElementById('signupName').value;

        if (!email || !password || !name) return alert('모든 항목을 입력해주세요.');

        try {
            const response = await fetch('/api/v1/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, name })
            });

            if (response.ok) {
                alert('회원가입이 완료되었습니다! 로그인해주세요.');
                toggleAuthMode('login');
            } else {
                alert('회원가입 실패: 이미 사용중인 이메일일 수 있습니다.');
            }
        } catch (error) {
            console.error(error);
            alert('서버 오류가 발생했습니다.');
        }
    }

    // 글로벌 헤더
    async function loadHeader() {
        const res = await fetch('/header.html');
        const html = await res.text();
        document.body.insertAdjacentHTML('afterbegin', html);
        document.getElementById('nav-' + currentPageId).classList.add('active');
    }
</script>
</body>
</html>
